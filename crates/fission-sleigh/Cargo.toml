[package]
name = "fission-sleigh"
version = "0.3.0"
edition = "2021"
authors = ["Fission Dev Team"]
description = "Ghidra Sleigh compiler/runtime integration for Fission"
repository = "https://github.com/fission-systems/Fission"
license = "Apache-2.0"
readme = "../../README.md"
keywords = ["sleigh", "ghidra", "disassembly", "fission"]
categories = ["development-tools"]

[dependencies]
anyhow = "1.0.102"
fission-core = { path = "../fission-core" }
fission-pcode-ir = { path = "../fission-pcode-ir" }
flate2 = "1.1"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.145"
tracing = "0.1"
bincode = "1.3"
rkyv = { version = "0.8", features = ["bytecheck"] }
smallvec = "1.15"

[dev-dependencies]
fission-loader = { path = "../fission-loader" }
fission-static = { path = "../fission-static" }
tempfile = "3.23.0"
