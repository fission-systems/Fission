[package]
name = "fission-dioxus"
version = "0.1.7"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Pure Rust desktop GUI for Fission using Dioxus"

[dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
dioxus-html = { version = "0.7" }
dioxus-logger = "0.7"
tracing = "0.1"
tokio = { version = "1.0", features = ["full"] }
rfd = "0.14"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde_json = "1"

fission-core = { path = "../fission-core" }
fission-loader = { path = "../fission-loader" }
fission-static = { path = "../fission-static" }
fission-decompiler = { path = "../fission-decompiler" }
fission-signatures = { path = "../fission-signatures" }
fission-ui = { path = "../fission-ui" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3"
