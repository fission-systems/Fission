[package]
name = "fission-midend-prehir"
version = "0.2.3"
edition = "2024"
authors = ["Fission Dev Team"]
description = "PreHIR midend substrate: the mutable pre-structuring AST, action pipeline, and value-set analysis used before HIR materialization"
repository = "https://github.com/fission-systems/Fission"
license = "Apache-2.0"
readme = "../../README.md"
keywords = ["decompiler", "midend", "ir"]
categories = ["development-tools"]

[dependencies]
fission-core = { path = "../fission-core" }
fission-midend-core = { path = "../fission-midend-core" }
indexmap = "2"
rustc-hash = "2.1"
tracing = "0.1"

[dev-dependencies]
serde_json = "1.0"
