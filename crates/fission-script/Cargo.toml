[package]
name = "fission-script"
version = "0.2.3"
edition = "2024"
authors = ["Fission Dev Team"]
description = "Rust-native embedded scripting (Rhai) for read-only binary automation"
repository = "https://github.com/fission-systems/Fission"
license = "AGPL-3.0-or-later"
readme = "README.md"
keywords = ["fission", "scripting", "rhai", "reverse-engineering"]
categories = ["development-tools"]

[features]
default = []
# A script can drive a live emulated machine: breakpoints, stepping,
# watchpoints, registers, memory. This is the half of the tool a one-shot
# command line cannot reach, because an emulated process dies with the command
# that launched it.
emulator = ["dep:fission-dynamic"]

[dependencies]
fission-core = { path = "../fission-core" }
fission-loader = { path = "../fission-loader" }
fission-static = { path = "../fission-static", default-features = false }
fission-dynamic = { path = "../fission-dynamic", features = [
    "interactive_runtime",
], optional = true }
rhai = { version = "1.24", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
