[package]
name = "fission-project"
version = "0.2.3"
edition = "2024"
authors = ["Fission Dev Team"]
description = "What an analyst decided about a binary, kept between runs"
repository = "https://github.com/fission-systems/Fission"
license = "AGPL-3.0-or-later"
keywords = ["fission", "reverse-engineering", "project"]
categories = ["development-tools"]

[dependencies]
fission-loader = { path = "../fission-loader" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3"
