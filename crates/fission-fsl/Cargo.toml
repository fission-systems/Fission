[package]
name = "fission-fsl"
version = "0.1.0"
edition = "2021"
authors = ["Fission Dev Team"]
description = "Fission-owned instruction specification compiler and FIR"
repository = "https://github.com/fission-systems/Fission"
license = "Apache-2.0"
keywords = ["isa", "compiler", "decompiler", "fir"]
categories = ["development-tools"]

[lib]
name = "fission_fsl"

[dependencies]
cranelift-codegen = "0.133.1"
cranelift-frontend = "0.133.1"
cranelift-jit = "0.133.1"
cranelift-module = "0.133.1"
cranelift-native = "0.133.1"
cranelift-object = "0.133.1"
sha2 = "0.10.9"
fission-loader = { path = "../fission-loader", optional = true }

[features]
x86 = ["dep:fission-loader"]

[[bin]]
name = "fslc"
path = "src/main.rs"

[[bin]]
name = "fsl-x86"
path = "src/x86_main.rs"
required-features = ["x86"]
