[package]
name = "fission-dynamic"
version = "0.2.3"
edition = "2024"
authors = ["Fission Dev Team"]
description = "Fission dynamic analysis, runtime, plugin, and unpacker engine"
repository = "https://github.com/fission-systems/Fission"
license = "AGPL-3.0-or-later"
readme = "../../README.md"
keywords = ["fission", "debugger", "reverse-engineering", "runtime"]
categories = ["development-tools::debugging"]

[features]
default = []
# The Win32 debugger backend. Off by default because it does not compile:
# 269 errors against windows-rs 0.54, from imports that moved (`Nt*` to `Wdk`,
# `HMODULE` to `Foundation`), an event constant that never had the name it is
# given, and an `ExecutionBackend` impl declaring five methods the trait does
# not have. Nothing has built it in a long time, and a feature nobody turns on
# is a feature nobody can tell is broken -- so it is named, off, and honest,
# rather than silently wired into a build that never happens.
#
# The emulator backend runs Windows binaries on every host and is the one
# under test; this is only for driving a *live* Windows process.
windows_native_debugger = []
# `tokio`, `sysinfo`, `libloading` and `rayon` were in here and no source
# file in this crate referenced any of them. They came along whenever the
# feature was on, which -- now that the CLI's `debugger` is a default -- is
# every build: 300 dependencies became 283 by deleting four lines.
interactive_runtime = [
    "dep:fission-plugin",
    "dep:crossbeam-channel",
    "dep:windows",
    "dep:nix",
]

[dependencies]
fission-emulator = { path = "../fission-emulator" }
fission-core = { path = "../fission-core" }
fission-ttd = { path = "../fission-ttd" }
fission-plugin = { path = "../fission-plugin", optional = true, default-features = false, features = ["interactive_runtime"] }
fission-sleigh = { path = "../fission-sleigh" }
fission-loader = { path = "../fission-loader" }
fission-static = { path = "../fission-static", default-features = false }
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
crossbeam-channel = { version = "0.5", optional = true }
rkyv = { version = "0.8", features = ["bytecheck"] }
regex = "1.12"
lru = "0.18"
dirs = "6.0"
once_cell = "1.21"

[target.'cfg(target_os = "windows")'.dependencies]
# The debugger has never compiled on Windows: the module list was missing
# the ones holding `SystemServices`, `SystemInformation` and the WOW64 and
# `NtQueryInformation*` entry points. Nothing built it, so nothing said so.
windows = { version = "0.54", features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_ProcessStatus",
    "Win32_System_Kernel",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_WindowsProgramming",
    "Wdk_System_Threading",
], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.28", features = ["ptrace", "process"], optional = true }
