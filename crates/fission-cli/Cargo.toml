[package]
name = "fission-cli"
version = "0.2.3"
edition = "2024"
authors = ["Fission Dev Team"]
description = "Fission CLI and entrypoint"
repository = "https://github.com/fission-systems/Fission"
license = "AGPL-3.0-or-later"
readme = "../../README.md"
keywords = ["fission", "decompiler", "reverse-engineering", "ghidra"]
categories = ["development-tools::debugging"]
default-run = "fission_cli"

[lib]
name = "fission_cli"
path = "src/lib.rs"

[features]
# mimalloc by default: a profile of `decomp` over a whole binary put ~25% of
# non-idle self time in the system allocator (`_xzm_free`, `_xzm_xzone_malloc_
# tiny`, `_malloc_zone_malloc`), more than any single Fission function. The
# feature and the `#[global_allocator]` wiring already existed and were simply
# never switched on. Measured, same machine, interleaved runs, output byte
# identical: `coreutils/[` 155 functions 2.77s -> 1.66s (-40%),
# `crazyflie/cf2` 2,838 functions 56.7s -> 37.6s (-34%).
default = ["allocator-mimalloc"]
debugger = ["dep:fission-dynamic"]
allocator-mimalloc = ["dep:mimalloc"]
allocator-jemallocator = ["dep:jemallocator"]

[dependencies]
unicode-width = "0.2"
fission-core = { path = "../fission-core" }
fission-script = { path = "../fission-script" }
fission-loader = { path = "../fission-loader" }
fission-analysis-db = { path = "../fission-analysis-db" }
fission-static = { path = "../fission-static" }
fission-decompiler = { path = "../fission-decompiler" }
fission-sleigh = { path = "../fission-sleigh" }

fission-emulator = { path = "../fission-emulator" }
fission-dir = { path = "../fission-dir" }
fission-dynamic = { path = "../fission-dynamic", optional = true, features = ["interactive_runtime"] }
fission-ai = { path = "../fission-ai" }
fission-tui = { path = "../fission-tui" }
rayon = "1.10"
tracing = "0.1"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
miette = { version = "7.4", features = ["fancy"] }
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
mimalloc = { version = "0.1", optional = true }
jemallocator = { version = "0.5", optional = true }
ctrlc = "3.5.2"
fission-serve = { path = "../fission-serve" }

[[bin]]
name = "fission_cli"
path = "src/bin/fission_cli.rs"
test = false

[[bin]]
name = "fission_preview_worker"
path = "src/bin/fission_preview_worker.rs"
test = false

[[bin]]
name = "fission_nir_worker"
path = "src/bin/fission_nir_worker.rs"
test = false
