name: Fuzz

# Fuzzing is not a gate: a run finds what it finds in its time budget, so it
# runs on a schedule and reports into an issue instead of turning a push red.
on:
  schedule:
    # Run nightly at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      fuzz_duration:
        description: "Fuzz duration per target (seconds)"
        default: "300"
        required: false

env:
  CARGO_TERM_COLOR: always
  FUZZ_DURATION: ${{ github.event.inputs.fuzz_duration || '300' }}

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Loader targets seed from the checked-in fixtures (DWARF 2/5, LSDA,
          # RTTI, Mach-O, PE+PDB, SEH, COFF objects).
          - target: fuzz_pe_parser
            crate_dir: crates/fission-loader
          - target: fuzz_elf_parser
            crate_dir: crates/fission-loader
          - target: fuzz_macho_parser
            crate_dir: crates/fission-loader
          - target: fuzz_coff_object
            crate_dir: crates/fission-loader
          - target: fuzz_any_format
            crate_dir: crates/fission-loader
          # Decoder and lifter on arbitrary bytes, four ISAs.
          - target: fuzz_sleigh_decode
            crate_dir: crates/fission-sleigh

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        with:
          lfs: false
          submodules: recursive


      - name: Setup Utils
        uses: ./.github/actions/setup-utils
      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly
        with:
          toolchain: nightly
          components: llvm-tools-preview

      - name: Cache cargo-fuzz
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-v1

      - name: Install cargo-fuzz
        run: |
          if ! command -v cargo-fuzz &> /dev/null; then
            cargo install cargo-fuzz --locked
          fi

      # Real inputs reach the deep parser paths a random start never does.
      # The seed helper this step used to look for was never checked in.
      - name: Seed corpus from checked-in fixtures
        env:
          CRATE_DIR: ${{ matrix.crate_dir }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          corpus="${CRATE_DIR}/fuzz/corpus/${TARGET}"
          mkdir -p "$corpus"
          if [ -d "${CRATE_DIR}/testdata" ]; then
            find "${CRATE_DIR}/testdata" -type f ! -name '*.c' ! -name '*.cpp' -size -2M \
              -exec cp {} "$corpus"/ \;
          fi
          echo "seeds: $(find "$corpus" -type f | wc -l)"

      # Each run starts from what earlier runs found. The corpus used to be
      # uploaded and never read back, so every run began from the seeds.
      - name: Restore corpus from earlier runs
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ matrix.crate_dir }}/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Run fuzzer — ${{ matrix.target }}
        working-directory: ${{ matrix.crate_dir }}
        env:
          # SLEIGH specs for fuzz_sleigh_decode; the loader targets ignore it.
          FISSION_RESOURCE_ROOT: ${{ github.workspace }}/utils
        run: |
          cargo fuzz run ${{ matrix.target }} -- \
            -max_total_time=${{ env.FUZZ_DURATION }} \
            -max_len=65536 \
            -print_final_stats=1
        # libfuzzer exits 0 on timeout, non-zero on crash
        continue-on-error: false

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crashes-${{ matrix.target }}-${{ github.sha }}
          path: |
            ${{ matrix.crate_dir }}/fuzz/artifacts/${{ matrix.target }}/
          retention-days: 30

      - name: Save corpus for the next run
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ matrix.crate_dir }}/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

  report:
    needs: fuzz
    if: always()
    permissions:
      issues: write
    uses: ./.github/workflows/reusable-report-red.yml
    with:
      result: ${{ needs.fuzz.result }}
      detail: "crash inputs are attached to the run as fuzz-crashes-<target>-<sha>; reproduce with cargo fuzz run <target> <file>"
