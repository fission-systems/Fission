name: Reusable Lint and Format

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: false
        default: ubuntu-latest
      exclude_crates:
        type: string
        required: false
        default: ""
        description: "Crates to exclude from clippy (comma-separated)"

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: false
          submodules: false

      - name: Setup Utils
        uses: ./.github/actions/setup-utils
      - name: Guard — crate sources must not reference benchmark fixtures
        run: python3 scripts/test/no_benchmark_fixture_refs_in_crates.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Cache Rust Build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fission-lint-${{ runner.os }}
          cache-on-failure: true

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint with Clippy (Deny Warnings)
        shell: bash
        run: |
          exclude_flags=()
          if [ -n "${{ inputs.exclude_crates }}" ]; then
            IFS=',' read -ra EX <<< "${{ inputs.exclude_crates }}"
            for c in "${EX[@]}"; do
              c="$(echo "$c" | tr -d '[:space:]')"
              [ -z "$c" ] && continue
              exclude_flags+=(--exclude "$c")
            done
          fi
          cargo clippy --workspace "${exclude_flags[@]}" --locked -- -D warnings -A clippy::style -A clippy::complexity

      # Features that are not defaults are compiled by nothing above, and
      # `--workspace` runs none of their tests. Both halves of that went wrong
      # repeatedly: `fission-dynamic`'s debug layer had stopped compiling
      # altogether (`emulator_backend.rs` called a three-argument
      # `Emulator::new` and read a field renamed long before), a new `debug`
      # subcommand left the CLI dispatcher's match non-exhaustive, and
      # `app/snapshot.rs`'s test module was missing a loader field -- each time
      # every check passed, because nothing built it.
      #
      # These *run* the tests rather than checking that they compile. A check
      # catches "does not build"; it catches nothing about "does not work",
      # and these suites are the only coverage the debugger, the session and
      # the machine scripting have.
      - name: Test optional features (interactive_runtime)
        shell: bash
        run: cargo test -p fission-dynamic --features interactive_runtime --locked

      - name: Test optional features (script emulator)
        shell: bash
        run: cargo test -p fission-script --features emulator --locked

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true
