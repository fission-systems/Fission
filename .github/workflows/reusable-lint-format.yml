name: Reusable Lint and Format

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: false
        default: ubuntu-latest
      exclude_crates:
        type: string
        required: false
        default: ""
        description: "Crates to exclude from clippy (comma-separated)"
      crates:
        type: string
        required: false
        default: ""
        description: "Affected packages to lint (comma-separated); empty selects the workspace"

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ${{ inputs.os }}
    # Formatting and owner audits remain workspace-wide; Clippy is scoped to
    # the affected packages selected by the caller.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: false
          submodules: false

      - name: Setup Utils
        uses: ./.github/actions/setup-utils
      - name: Guard — crate sources must not reference benchmark fixtures
        run: python3 scripts/test/no_benchmark_fixture_refs_in_crates.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Cache Rust Build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fission-lint-${{ runner.os }}
          cache-on-failure: true

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint with Clippy (Deny Warnings)
        shell: bash
        env:
          CRATES: ${{ inputs.crates }}
          EXCLUDE_CRATES: ${{ inputs.exclude_crates }}
        run: |
          package_flags=()
          exclude_flags=()
          if [ -n "$CRATES" ]; then
            IFS=',' read -ra PACKAGES <<< "$CRATES"
            IFS=',' read -ra EX <<< "$EXCLUDE_CRATES"
            for p in "${PACKAGES[@]}"; do
              p="$(echo "$p" | tr -d '[:space:]')"
              [ -z "$p" ] && continue
              skip=false
              for c in "${EX[@]}"; do
                c="$(echo "$c" | tr -d '[:space:]')"
                [ "$p" = "$c" ] && skip=true
              done
              [ "$skip" = true ] || package_flags+=(-p "$p")
            done
            if [ "${#package_flags[@]}" -eq 0 ]; then
              echo "No selected packages remain after exclusions; skipping Clippy."
              exit 0
            fi
          fi
          if [ -n "$EXCLUDE_CRATES" ]; then
            IFS=',' read -ra EX <<< "$EXCLUDE_CRATES"
            for c in "${EX[@]}"; do
              c="$(echo "$c" | tr -d '[:space:]')"
              [ -z "$c" ] && continue
              exclude_flags+=(--exclude "$c")
            done
          fi
          if [ "${#package_flags[@]}" -gt 0 ]; then
            cargo clippy "${package_flags[@]}" --locked -- -D warnings -A clippy::style -A clippy::complexity
          else
            cargo clippy --workspace "${exclude_flags[@]}" --locked -- -D warnings -A clippy::style -A clippy::complexity
          fi

      # Static audit for Rust tests missed by harness discovery. Keep it in
      # Fast Gate while exhaustive feature compilation runs in Heavy.
      - name: Tests nothing runs
        shell: bash
        run: scripts/audit/unrun_tests_scan.py

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true
