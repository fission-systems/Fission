name: Reusable Lint and Format

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: false
        default: ubuntu-latest
      exclude_crates:
        type: string
        required: false
        default: ""
        description: "Crates to exclude from clippy (comma-separated)"

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: false
          submodules: false

      - name: Setup Utils
        uses: ./.github/actions/setup-utils
      - name: Guard — crate sources must not reference benchmark fixtures
        run: python3 scripts/test/no_benchmark_fixture_refs_in_crates.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Cache Rust Build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fission-lint-${{ runner.os }}
          cache-on-failure: true

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint with Clippy (Deny Warnings)
        shell: bash
        run: |
          exclude_flags=()
          if [ -n "${{ inputs.exclude_crates }}" ]; then
            IFS=',' read -ra EX <<< "${{ inputs.exclude_crates }}"
            for c in "${EX[@]}"; do
              c="$(echo "$c" | tr -d '[:space:]')"
              [ -z "$c" ] && continue
              exclude_flags+=(--exclude "$c")
            done
          fi
          cargo clippy --workspace "${exclude_flags[@]}" --locked -- -D warnings -A clippy::style -A clippy::complexity

      # Every build configuration this workspace has, compiled.
      #
      # A feature that is not a default is compiled by nothing above:
      # `--workspace` uses default features, so `interactive_runtime`,
      # `emulator`, `softfloat` and the allocator choices were built by no job
      # at all. Five defects hid in exactly that gap -- `fission-dynamic`'s
      # debug layer had stopped compiling, a new `debug` subcommand left the
      # CLI dispatcher's match non-exhaustive, `app/snapshot.rs`'s tests were
      # missing a loader field, a Linux-only `use` kept main red for ten
      # commits, and the Win32 debugger backend had 269 errors -- and each was
      # found by accident because nothing looked.
      #
      # The list of configurations lives in the script, not here, so adding a
      # feature and forgetting to cover it is one edit rather than two. The
      # script also runs on a developer's machine, where `--all` adds the
      # Windows cross build and a Linux container.
      - name: Compile surface (every feature combination)
        shell: bash
        run: scripts/audit/compile_surface.sh

      # And the tests inside those configurations that no runner runs. A
      # compile-surface audit cannot see these: the configuration *was* built,
      # and only the harness skipped the function. Four were found this way in
      # `fission-dir` (a `#[test]` written twice above a doc comment, leaving
      # the two functions that followed it with none) and two more elsewhere,
      # one of which failed the moment it was allowed to run.
      - name: Tests nothing runs
        shell: bash
        run: scripts/audit/unrun_tests_scan.py

      # And running the tests those configurations hold. A check catches
      # "does not build"; it catches nothing about "does not work", and these
      # suites are the only coverage the debugger, the session and the machine
      # scripting have.
      - name: Test optional features (interactive_runtime)
        shell: bash
        run: cargo test -p fission-dynamic --features interactive_runtime --locked

      - name: Test optional features (script emulator)
        shell: bash
        run: cargo test -p fission-script --features emulator --locked

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true
