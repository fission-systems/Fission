name: Reusable Lint and Format

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: false
        default: ubuntu-latest
      exclude_crates:
        type: string
        required: false
        default: ""
        description: "Crates to exclude from clippy (comma-separated)"

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: false
          submodules: false

      - name: Setup Utils
        uses: ./.github/actions/setup-utils
      - name: Guard — crate sources must not reference benchmark fixtures
        run: python3 scripts/test/no_benchmark_fixture_refs_in_crates.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Cache Rust Build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fission-lint-${{ runner.os }}
          cache-on-failure: true

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint with Clippy (Deny Warnings)
        shell: bash
        run: |
          exclude_flags=()
          if [ -n "${{ inputs.exclude_crates }}" ]; then
            IFS=',' read -ra EX <<< "${{ inputs.exclude_crates }}"
            for c in "${EX[@]}"; do
              c="$(echo "$c" | tr -d '[:space:]')"
              [ -z "$c" ] && continue
              exclude_flags+=(--exclude "$c")
            done
          fi
          cargo clippy --workspace "${exclude_flags[@]}" --locked -- -D warnings -A clippy::style -A clippy::complexity

      # `fission-dynamic`'s debugger, timeline and TTD layers live behind
      # `interactive_runtime`, which is not a default feature -- so `--workspace`
      # above does not compile a line of them. They had stopped compiling
      # altogether: `emulator_backend.rs` still called a three-argument
      # `Emulator::new` and read a field named `rip` that has been `pc` for a
      # long time, and nothing noticed because nothing built it. A feature that
      # no job turns on is a feature nobody can tell is broken.
      #
      # `--all-targets`, because without it this check covers the library and
      # not its tests, and the crate's own test module had gone stale the same
      # way: `app/snapshot.rs` built a `LoadedBinaryInner` missing a field
      # added to the loader some time ago. Half a check is how the second half
      # rots.
      - name: Check optional features (interactive_runtime)
        shell: bash
        run: cargo check -p fission-dynamic --features interactive_runtime --all-targets --locked

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true
