name: Release Tag (CI green)

on:
  push:
    tags: ["v*.*.*", "[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "SemVer to promote (default: the tag the merged Release PR recorded)"
        required: false
        default: ""
        type: string
      ref:
        description: "The Release PR's merge commit on main (default main; use the same SHA when retrying)"
        required: false
        default: main
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-tag-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify-gates:
    name: Verify eligible source, L0 and L1
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      tag: ${{ steps.gate.outputs.tag }}
    steps:
      - name: Resolve candidate and check CI on its exact SHA
        id: gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_TAG: ${{ inputs.tag }}
        with:
          script: |
            const repo = context.repo;
            const manual = context.eventName === "workflow_dispatch";
            if (manual && context.ref !== "refs/heads/main") {
              throw Error("Dispatch the release workflow on main.");
            }
            const target = manual ? (process.env.INPUT_REF.trim() || "main") : context.ref;
            const { data: commit } = await github.rest.repos.getCommit({ ...repo, ref: target });
            const sha = commit.sha;
            const readAtSha = async (path) => {
              try {
                const { data } = await github.rest.repos.getContent({ ...repo, path, ref: sha });
                return Buffer.from(data.content, data.encoding).toString("utf8");
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            };
            // Written by prepare-release.yml on the Release PR.
            const recordText = await readAtSha(".github/release-candidate.json");
            const record = recordText ? JSON.parse(recordText) : null;
            const tag = manual
              ? (process.env.INPUT_TAG.trim() || (record && record.tag) || "")
              : context.ref.replace(/^refs\/tags\//, "");
            if (!/^v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[\da-zA-Z-]+(\.[\da-zA-Z-]+)*)?$/.test(tag)) {
              throw Error("A SemVer release tag is required.");
            }
            const { data: ancestry } = await github.rest.repos.compareCommitsWithBasehead({
              ...repo, basehead: `main...${sha}`,
            });
            if (!["behind", "identical"].includes(ancestry.status)) {
              throw Error(`Candidate ${sha} has not landed on main.`);
            }
            const gates = [
              ["ci.yml", ["push"]],
              ["ci-heavy.yml", ["schedule", "workflow_dispatch"]],
            ];
            for (const [workflow_id, events] of gates) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...repo, workflow_id, head_sha: sha, per_page: 100,
                ...(workflow_id === "ci.yml" ? { branch: "main" } : {}),
              });
              const run = data.workflow_runs.find(r =>
                r.status === "completed" && r.conclusion === "success" && events.includes(r.event)
              );
              if (!run) throw Error(`${workflow_id} must pass on main at ${sha}.`);
              core.info(`${workflow_id}: ${run.html_url}`);
            }

            // The commit L0/L1 verified (and L2 will) must be the merged
            // Release PR, on top of the candidate its notes were drafted from.
            if (!record || record.tag !== tag) {
              throw Error(`${sha} records no Release PR for ${tag}; run "Prepare Release PR" and merge it.`);
            }
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              ...repo, commit_sha: sha,
            });
            const releasePr = prs.find(pr =>
              pr.merged_at && pr.merge_commit_sha === sha && pr.head.ref === `release/${tag}`
            );
            if (!releasePr) {
              throw Error(`${sha} is not the merge commit of the ${tag} Release PR (branch release/${tag}).`);
            }
            const { data: drift } = await github.rest.repos.compareCommitsWithBasehead({
              ...repo, basehead: `${record.candidate_sha}...${sha}`, per_page: 100,
            });
            const releaseFile = f =>
              ["Cargo.lock", "mkdocs.yml", ".github/release-candidate.json"].includes(f) ||
              /^crates\/[^/]+\/Cargo\.toml$/.test(f) ||
              /^docs\/changelog\/[^/]+\.md$/.test(f);
            const foreign = (drift.files || []).map(f => f.filename).filter(f => !releaseFile(f));
            if (drift.status !== "ahead" || (drift.files || []).length >= 300 || foreign.length) {
              throw Error(
                `main moved past the candidate ${record.candidate_sha} before the Release PR merged ` +
                `(${foreign.slice(0, 5).join(", ") || drift.status}); re-run "Prepare Release PR".`
              );
            }
            const notes = await readAtSha(record.notes);
            if (notes === null) throw Error(`${record.notes} is missing at ${sha}.`);
            if (notes.includes("TODO(release)")) {
              throw Error(`${record.notes} still has a TODO(release) block to fill.`);
            }
            core.info(`Release PR: ${releasePr.html_url}; candidate ${record.candidate_sha}`);

            try {
              const { data: old } = await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` });
              const { data: tagged } = await github.rest.repos.getCommit({ ...repo, ref: old.ref });
              if (tagged.sha !== sha) throw Error(`${tag} already points at a different SHA.`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({ ...repo, tag });
              if (!release.draft) throw Error(`${tag} is already published.`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            core.setOutput("tag", tag);
            core.setOutput("sha", sha);

      # Before any build: the tag is the version the binary will report.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.gate.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            crates/fission-cli/Cargo.toml
            scripts/release
          sparse-checkout-cone-mode: false
      - name: Tag equals the CLI version
        env:
          TAG: ${{ steps.gate.outputs.tag }}
        run: python3 scripts/release/check_identity.py source --tag "$TAG"

  release-e2e:
    name: L2 Release E2E
    needs: verify-gates
    uses: ./.github/workflows/release-e2e.yml
    with:
      ref: ${{ needs.verify-gates.outputs.sha }}

  package:
    needs: verify-gates
    uses: ./.github/workflows/cd.yml
    with:
      source_sha: ${{ needs.verify-gates.outputs.sha }}
      version: ${{ needs.verify-gates.outputs.tag }}

  publish:
    name: Attest and publish verified artifacts
    needs: [verify-gates, release-e2e, package]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.verify-gates.outputs.tag }}
      SHA: ${{ needs.verify-gates.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-gates.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-dist
          path: dist
      - name: Verify candidate identity and bytes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SHA"
          cd dist
          jq -e --arg tag "$TAG" --arg sha "$SHA" '.tag == $tag and .sha == $sha' release.json
          sha256sum -c SHA256SUMS
      - name: Verify tag, packaged binary and resource manifests agree
        run: |
          set -euo pipefail
          version="${TAG#v}"
          python3 scripts/release/check_identity.py source --tag "$TAG"
          work="$(mktemp -d)"
          tar -C "$work" -xzf dist/fission-x86_64-unknown-linux-gnu.tar.gz
          (cd "$(mktemp -d)" && env -u FISSION_ROOT -u FISSION_RESOURCE_ROOT \
            "$work/fission-x86_64-unknown-linux-gnu/bin/fission_cli" resources status --json) \
            | python3 scripts/release/check_identity.py status --tag "$TAG" --sha "$SHA" --version "$version"
          mkdir "$work/resources"
          tar -C "$work/resources" -xzf dist/fission-resources.tar.gz fission-resources.json
          python3 scripts/release/check_identity.py manifest "$work/resources/fission-resources.json" \
            --tag "$TAG" --sha "$SHA" --version "$version"
      - name: Attest the verified archives, CLI and manifests
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "dist/*"
      - name: Create or verify tag and populate draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tag_ref="refs/tags/$TAG"
          existing="$(git ls-remote origin "$tag_ref" "$tag_ref^{}")"
          if [[ -z "$existing" ]]; then
            git tag -a "$TAG" "$SHA" -m "Release $TAG"
            git push origin "$tag_ref"
          else
            git fetch --no-tags origin "$tag_ref"
            test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$SHA"
          fi
          notes="docs/changelog/$TAG.md"
          test -s "$notes"
          if gh release view "$TAG" --json isDraft > release-state.json; then
            jq -e '.isDraft == true' release-state.json
            gh release edit "$TAG" --notes-file "$notes"
          else
            flags=()
            if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" --verify-tag --draft --notes-file "$notes" "${flags[@]}"
          fi
          gh release upload "$TAG" --clobber dist/*
          mkdir attached
          gh release download "$TAG" --pattern '*' --dir attached
          (cd attached && sha256sum -c SHA256SUMS)
          cmp dist/SHA256SUMS attached/SHA256SUMS
          cmp dist/release.json attached/release.json
          gh release edit "$TAG" --draft=false

  # Sentry release + commit tracking, once the GitHub Release is public.
  # The name is what fission_cli's opt-in telemetry reports when
  # SENTRY_RELEASE / FISSION_RELEASE are unset: `sentry::release_name!()`,
  # i.e. `<CARGO_PKG_NAME>@<CARGO_PKG_VERSION>` of fission-cli. verify-gates
  # (check_identity.py source) already proved the tag without its `v` equals
  # that version. Release builds report environment `production` (the
  # sentry crate's default without debug_assertions), so the deploy uses it.
  # Without the SENTRY_AUTH_TOKEN secret every step after the check is
  # skipped and the job still succeeds; it never gates or reorders the
  # release, which `publish` has already completed.
  sentry-release:
    name: Sentry release and commits
    needs: [verify-gates, publish]
    if: >-
      github.repository == 'fission-systems/Fission' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ needs.verify-gates.outputs.tag }}
      SHA: ${{ needs.verify-gates.outputs.sha }}
      SENTRY_ORG: fission-systems
      SENTRY_PROJECT: fission
      SENTRY_CLI_VERSION: 3.8.2
      # GitHub's server-side digest of sentry-cli-Linux-x86_64 for 3.8.2.
      SENTRY_CLI_SHA256: c958865f9d4000183509ea21b1f04925d5390de6d8d87386b9e69f2b305070c3
    steps:
      - name: Check for the Sentry token
        id: token
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [[ -n "${SENTRY_AUTH_TOKEN}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Sentry release skipped::SENTRY_AUTH_TOKEN is not set; no Sentry release recorded for ${TAG}."
          fi

      # Full history without blobs, and only one small file checked out:
      # `set-commits --local` walks history, `--auto` reads the origin remote.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.token.outputs.present == 'true'
        with:
          ref: ${{ needs.verify-gates.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            crates/fission-cli/Cargo.toml
          sparse-checkout-cone-mode: false

      - name: Install sentry-cli (pinned, checksum-verified)
        if: steps.token.outputs.present == 'true'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SHA"
          bin="${RUNNER_TEMP}/sentry-bin"
          mkdir -p "$bin"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$bin/sentry-cli" \
            "https://github.com/getsentry/sentry-cli/releases/download/${SENTRY_CLI_VERSION}/sentry-cli-Linux-x86_64"
          echo "${SENTRY_CLI_SHA256}  $bin/sentry-cli" | sha256sum -c -
          chmod +x "$bin/sentry-cli"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Create, link commits, finalize and deploy
        if: steps.token.outputs.present == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          sentry-cli --version
          release="fission-cli@${TAG#v}"
          echo "Sentry release: ${release} (${SHA})"
          sentry-cli releases new "$release"
          if ! sentry-cli releases set-commits "$release" --auto --ignore-missing; then
            echo "::warning title=Sentry set-commits::--auto failed (integration cannot see the repo?); falling back to --local."
            sentry-cli releases set-commits "$release" --local --ignore-missing
          fi
          sentry-cli releases finalize "$release"
          sentry-cli deploys new --release "$release" --env production \
            --name "$TAG" \
            --url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
