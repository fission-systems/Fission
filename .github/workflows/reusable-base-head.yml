name: Reusable base-vs-head decompiler comparison

# Fast Gate calls this for decompiler changes, or a PR labelled
# type:performance, after the Linux tests pass. It builds the base and head CLIs once
# and, on a fixed FreshBench M1 sample, reports to the job summary:
# - speed: instructions executed by each (scripts/ci/speed_compare.py),
#   flagged at +3%;
# - output (decompiler changes only): `freshbench sweep diff` of the two,
#   functions whose text changed first, then score deltas on those
#   (scripts/ci/output_diff.py). The base side comes from main's output
#   ledger (output-ledger.yml) when it has a matching run; otherwise the
#   base is decompiled here.
# Report-only: neither gates the merge yet.

on:
  workflow_call:
    inputs:
      base_sha:
        description: "Commit to compare against (the PR or merge group base)"
        required: true
        type: string
      output_diff:
        description: "Also diff decompiler output and scores"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  # Download main's output-ledger artifact.
  actions: read

env:
  CARGO_TERM_COLOR: always
  FISSION_BENCHMARK_NO_CACHE: "1"

jobs:
  diff:
    name: Base vs head (speed${{ inputs.output_diff && ', output' || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BASE_SHA: ${{ inputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-utils
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: fission-output-diff-${{ runner.os }}
      - name: Build head and base CLIs
        run: |
          set -euo pipefail
          cargo build --locked --release -p fission-cli
          cp target/release/fission_cli "$RUNNER_TEMP/head_cli"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          # One target directory: the base build reuses every unchanged crate.
          (cd "$RUNNER_TEMP/base" && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build --locked --release -p fission-cli)
          cp target/release/fission_cli "$RUNNER_TEMP/base_cli"
      - name: Build the pinned scorer
        if: inputs.output_diff
        run: |
          set -euo pipefail
          commit="$(python3 -c 'import sys; sys.path.insert(0, "scripts/ci"); import freshbench_corpus as c; print(c.FRESHBENCH_COMMIT)')"
          cargo install --locked --git https://github.com/fission-systems/freshbench --rev "$commit" \
            --root "$RUNNER_TEMP/freshbench-tool" freshbench
      - name: Install valgrind
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends valgrind
      - name: Compare decompile cost (instructions executed)
        run: |
          python3 scripts/ci/speed_compare.py --data "$RUNNER_TEMP/freshbench" \
            --base-cli "$RUNNER_TEMP/base_cli" --head-cli "$RUNNER_TEMP/head_cli" \
            --base-resources "$RUNNER_TEMP/base/utils" --out output-diff
      - name: Decompile the sample with both and compare output
        if: inputs.output_diff
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Measurements run with error reporting off; `sweep run` refuses otherwise.
          env -u SENTRY_DSN -u FISSION_SENTRY -u FRESHBENCH_SENTRY \
            python3 scripts/ci/output_diff.py --data "$RUNNER_TEMP/freshbench" \
              --freshbench "$RUNNER_TEMP/freshbench-tool/bin/freshbench" \
              --base-cli "$RUNNER_TEMP/base_cli" --head-cli "$RUNNER_TEMP/head_cli" \
              --base-repo "$RUNNER_TEMP/base" --fetch-base-run --out output-diff
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: base-vs-head
          path: output-diff
          if-no-files-found: ignore
          retention-days: 14
