name: CI Heavy Validation

on:
  # The full cross-platform suite runs nightly and on demand for release candidates.
  # Main pushes keep the L0 Fast Gate without repeating this extended run.
  # Policy: docs/CI_RELEASE_GATES.md
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-heavy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows-heavy:
    name: 🪟 Heavy Build & Test (Windows)
    uses: ./.github/workflows/reusable-build-cli.yml
    with:
      os: windows-latest
      profile: release
      upload_artifact: true

  test-windows-heavy:
    name: 🧪 Heavy Tests (Windows)
    needs: build-windows-heavy
    uses: ./.github/workflows/reusable-run-tests.yml
    with:
      os: windows-latest
      crates: "fission-midend-structuring,fission-pcode,fission-decompiler"
      profile: release
      timeout_minutes: 120

  test-windows-native-debugger:
    name: 🪟 Native Win32 Debugger (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          submodules: false
      - name: Setup Utils
        uses: ./.github/actions/setup-utils
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust Build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fission-native-debugger-${{ runner.os }}
          cache-on-failure: true
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Check Win32 debugger and CLI feature builds
        run: |
          cargo check --locked -p fission-dynamic --features windows_native_debugger
          cargo check --locked -p fission-cli --features windows_native_debugger
      - name: Run native debugger tests
        run: cargo nextest run --locked -p fission-dynamic --features windows_native_debugger

  build-macos-heavy:
    name: 🍎 Heavy Build (macOS)
    uses: ./.github/workflows/reusable-build-cli.yml
    with:
      os: macos-latest
      profile: release
      upload_artifact: true

  msrv-check:
    name: 🦀 MSRV Check
    uses: ./.github/workflows/reusable-msrv.yml
    with:
      crates: "fission-midend-structuring,fission-pcode,fission-loader,fission-decompiler"

  # ── Extended (nightly + manual only) ──────────────────────────────────────
  test-linux-full:
    name: 🧪 Full Tests (Linux · extended)
    uses: ./.github/workflows/reusable-run-tests.yml
    with:
      os: ubuntu-latest
      crates: ""
      profile: debug
      # dioxus needs GUI sys libs; static is covered by its own job.
      exclude_crates: "fission-static"

  # No Miri job. It ran on fission-pcode and fission-loader, and it never
  # checked anything: under isolation it aborted each crate at its first file
  # `open`, and without isolation it stops at `insta` spawning a process and
  # at memmap2's file-backed mapping. Neither is undefined behaviour, and
  # neither crate had unsafe Miri could reach -- pcode's one block was a
  # raw-pointer reborrow the borrow checker did not need (now removed, and
  # the crate is `forbid(unsafe_code)`), loader's is the mmap itself. The code
  # that is actually unsafe here is the emulator's JIT and the dynamic crate's
  # OS FFI, which Miri cannot run. `reusable-miri.yml` stays, fixed, for a
  # crate that grows unsafe it can check.

  coverage:
    name: 📈 Code Coverage (extended)
    uses: ./.github/workflows/reusable-coverage.yml
    with:
      crates: "fission-pcode,fission-loader"
      warn_threshold_pct: 60

  # Final summary for the nightly and manual validation run.
  heavy-summary:
    name: ✅ Heavy Validation Summary
    needs:
      - build-macos-heavy
      - test-windows-heavy
      - test-windows-native-debugger
      - msrv-check
      - test-linux-full
      - coverage
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Status
        run: |
          set -euo pipefail
          FAILED=0

          require_success() {
            local name="$1"
            local result="$2"
            if [ "$result" != "success" ]; then
              echo "❌ ${name} failed (result=${result})"
              FAILED=1
            else
              echo "✅ ${name}"
            fi
          }

          require_success "Full Linux tests" "${{ needs.test-linux-full.result }}"
          require_success "macOS heavy build" "${{ needs.build-macos-heavy.result }}"
          require_success "Windows heavy tests" "${{ needs.test-windows-heavy.result }}"
          require_success "Windows native debugger" "${{ needs.test-windows-native-debugger.result }}"
          require_success "MSRV" "${{ needs.msrv-check.result }}"

          # Coverage is warn-only even when run
          if [ "${{ needs.coverage.result }}" = "failure" ]; then
            echo "⚠️ Coverage job encountered an error (non-blocking)"
          elif [ "${{ needs.coverage.result }}" = "skipped" ]; then
            echo "ℹ️  Coverage skipped"
          else
            echo "ℹ️  Coverage finished (${{ needs.coverage.result }})"
          fi

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi
          echo "✅ Heavy validation checks passed for this event!"
          echo "ℹ️  Heavy runs nightly or on demand; dispatch it for a release candidate SHA before tagging."
