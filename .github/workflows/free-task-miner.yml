name: Free-task miner

# Finds documentation tasks with no model involved
# (scripts/ci/free_task_miner.py) and files each batch as an issue with a
# concrete list, labelled `agent:free` and `area:docs`.
# free-model-draft.yml then drafts the fix.
#
# Detectors: absolute home-directory paths in maintained Markdown; broken
# relative Markdown links whose target basename exists exactly once elsewhere
# in the repo; and, for ONE crate per run (rotating by day of year through
# DOC_CRATES in the script), public Rust items without a doc comment
# (`missing_docs`, via `cargo rustc -p <crate> --lib -- -W missing_docs`, which
# applies the lint to that crate only) and rustdoc lint warnings (`cargo doc
# --no-deps -p <crate>`). The Rust kinds carry the hidden marker
# `free-task-kind:comment-only`, so free-model-draft.yml refuses any draft that
# changes a Rust line that is not a comment. That is why the Rust toolchain is
# installed here.
#
# Each finding has a hidden `free-task-item` key (no line number); a finding
# that any agent:free issue (open or closed) already carries is skipped, and at
# most 3 issues are filed per run in total, kinds taking turns.
#
# Events created with GITHUB_TOKEN start no workflows, so the label on a mined
# issue does not trigger free-model-draft.yml. The miner starts it with
# `gh workflow run` (workflow_dispatch is allowed from GITHUB_TOKEN), hence
# `actions: write`.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be filed"
        required: false
        type: boolean
        default: true

permissions: {}

concurrency:
  group: free-task-miner
  cancel-in-progress: false

jobs:
  mine:
    name: Mine and file issues
    if: github.repository == 'fission-systems/Fission'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      actions: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: free-task-miner-${{ runner.os }}
      - name: Mine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mode="--create"
          if [ "$DRY_RUN" = "true" ]; then mode="--dry-run"; fi
          python3 scripts/ci/free_task_miner.py "$mode" --max-issues 3
