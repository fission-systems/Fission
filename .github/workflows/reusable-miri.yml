name: Reusable Miri UB Check

# Runs Miri on unsafe-containing crates to detect undefined behavior.
# Miri requires nightly Rust. Run in Heavy Nightly only — not Fast Gate.
#
# Target crates: fission-pcode (NIR structuring, unsafe CFG ops),
#               fission-loader (raw byte parsing, pointer arithmetic)

on:
  workflow_call:
    inputs:
      crates:
        type: string
        required: false
        default: "fission-pcode,fission-loader"
        description: "Crates to run Miri on (comma-separated)"

env:
  CARGO_TERM_COLOR: always
  # Strict provenance: catch ptr-int casts that may not be portable.
  #
  # Isolation is off because the unit tests read their own fixtures -- a
  # snapshot file in fission-pcode, the working directory in fission-loader --
  # and under isolation Miri aborts the whole crate at the first `open`. That
  # is an unsupported operation, not undefined behaviour, and it stopped each
  # crate before a single unsafe block was checked.
  MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-disable-isolation"

jobs:
  miri:
    name: Miri UB Check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

        with:
          lfs: false
          submodules: recursive


      - name: Setup Utils
        uses: ./.github/actions/setup-utils
      - name: Install Rust (nightly + Miri)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src

      - name: Cache Rust Build
        uses: Swatinem/rust-cache@v2
        with:
          key: miri-nightly

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            librsvg2-dev \
            build-essential

      - name: Run Miri (unit tests)
        shell: bash
        run: |
          set +e
          FAILED=0
          crates="${{ inputs.crates }}"
          IFS=',' read -ra CRATE_ARRAY <<< "$crates"
          for crate in "${CRATE_ARRAY[@]}"; do
            crate="$(echo "$crate" | tr -d '[:space:]')"
            echo "::group::Miri: $crate"
            cargo +nightly miri test -p "$crate" --locked 2>&1
            exit_code=$?
            echo "::endgroup::"
            if [ $exit_code -ne 0 ]; then
              # Any failure lands here: undefined behaviour, an unsupported
              # operation, or an ordinary test failure. Say which it might be
              # rather than calling all of them UB.
              echo "::error::Miri run failed in crate: $crate (undefined behaviour, an unsupported operation, or a failing test -- see the group above)"
              FAILED=1
            fi
          done
          exit $FAILED

      - name: Upload Miri output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: miri-output-${{ github.sha }}
          path: /tmp/miri-*.txt
          retention-days: 30
          if-no-files-found: ignore
