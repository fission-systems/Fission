name: CI Fast Gate

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# The cache service (rust-cache, sccache) authenticates with the runner's own
# token, not GITHUB_TOKEN, so no job here needs more than read access.
permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.event.pull_request.number || github.run_id }}
  # PRs supersede their own stale run. Pushes and merge candidates each retain a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Path-filter tiers (see docs/CI_RELEASE_GATES.md):
  #   docs     — docs/wiki/markdown only → documentation checks when selected
  #   scripts  — scripts/** only → pass-gate + script syntax
  #   ci       — .github/**, CI meta, or mixed CI/script edits → pass-gate + sanity
  #   rust     — crates/utils/Cargo/* → affected-package Linux checks (and macOS on main)
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.filter.outputs.lane }}
      run_doc_checks: ${{ steps.filter.outputs.run_doc_checks }}
      run_replay_checks: ${{ steps.filter.outputs.run_replay_checks }}
      run_security: ${{ steps.filter.outputs.run_security }}
      run_lint: ${{ steps.filter.outputs.run_lint }}
      run_advisories: ${{ steps.filter.outputs.run_advisories }}
      run_pass_gate: ${{ steps.filter.outputs.run_pass_gate }}
      run_script_checks: ${{ steps.filter.outputs.run_script_checks }}
      run_tests: ${{ steps.filter.outputs.run_tests }}
      run_debugger_tests: ${{ steps.filter.outputs.run_debugger_tests }}
      run_cli_smoke: ${{ steps.impact.outputs.run_cli_smoke == 'true' || steps.filter.outputs.run_cli_smoke == 'true' }}
      run_macos_test: ${{ steps.filter.outputs.run_macos_test }}
      run_actionlint: ${{ steps.filter.outputs.run_actionlint }}
      run_platform_debugger: ${{ steps.filter.outputs.run_platform_debugger }}
      run_solver_diff: ${{ steps.filter.outputs.run_solver_diff }}
      run_loader_fixtures: ${{ steps.filter.outputs.run_loader_fixtures }}
      run_decomp_corpus: ${{ steps.filter.outputs.run_decomp_corpus }}
      run_package_check: ${{ steps.filter.outputs.run_package_check }}
      run_sweep_smoke: ${{ steps.filter.outputs.run_sweep_smoke }}
      test_crates: ${{ steps.impact.outputs.crates }}
      run_interactive_runtime_tests: ${{ steps.impact.outputs.run_interactive_runtime_tests }}
      run_script_emulator_tests: ${{ steps.impact.outputs.run_script_emulator_tests }}
      run_emulator_softfloat_check: ${{ steps.impact.outputs.run_emulator_softfloat_check }}
      run_plugin_interactive_check: ${{ steps.impact.outputs.run_plugin_interactive_check }}
      run_cli_alt_feature_checks: ${{ steps.impact.outputs.run_cli_alt_feature_checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: false
          submodules: false

      - name: Classify changed paths
        id: filter
        shell: bash
        run: python3 scripts/ci/change_plan.py --paths "$RUNNER_TEMP/fission-changed-paths.txt" >> "$GITHUB_OUTPUT"

      - name: Install Rust for package impact selection
        if: steps.filter.outputs.run_tests == 'true'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Resolve affected crate suites
        id: impact
        if: steps.filter.outputs.run_tests == 'true'
        shell: bash
        run: python3 scripts/ci/select_affected_crates.py < "$RUNNER_TEMP/fission-changed-paths.txt" >> "$GITHUB_OUTPUT"

  doc-checks:
    name: Documentation examples and schemas
    needs: [changes]
    if: needs.changes.outputs.run_doc_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Reject new documentation warnings
        run: |
          set -euo pipefail
          python -m pip install -r scripts/ci/doc-check-requirements.txt
          base="$BASE_SHA"
          if [[ "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD)"
          fi
          python scripts/ci/check_docs.py --base "$base"
      - uses: ./.github/actions/setup-utils
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Run documentation examples and validate JSON schemas
        run: |
          set -euo pipefail
          cargo build --locked -p fission-cli
          python scripts/ci/check_docs.py --cli target/debug/fission_cli
          python scripts/ci/check_contract_schemas.py target/debug/fission_cli

  replay-checks:
    name: Native fixture replay and Python port
    needs: [changes]
    if: needs.changes.outputs.run_replay_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-utils
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Run native, emulated, HIR and Python comparisons
        run: |
          set -euo pipefail
          cargo build --locked -p fission-dir --example concrete_replay
          python3 scripts/test/replay_fixture.py --runner target/debug/examples/concrete_replay
      - name: Preserve a replayable mismatch
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fixture-replay-witness
          path: replay-witness.json

  # Step 1: Security & Lint
  security-check:
    name: Security Check
    needs: [changes]
    if: needs.changes.outputs.run_security == 'true'
    uses: ./.github/workflows/reusable-security-check.yml
    with:
      advisories: ${{ needs.changes.outputs.run_advisories == 'true' }}

  lint-format:
    name: Lint & Format
    needs: [changes]
    if: needs.changes.outputs.run_lint == 'true'
    uses: ./.github/workflows/reusable-lint-format.yml
    with:
      os: ubuntu-latest
      crates: ${{ needs.changes.outputs.test_crates }}
      exclude_crates: "fission-signatures"

  # scripts/ci-only / scripts-only: syntax + owner boundary scripts (no cargo test matrix)
  script-checks:
    name: Script Checks
    needs: [changes]
    if: needs.changes.outputs.run_script_checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false
          submodules: false

      - name: Python syntax (scripts/)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t py < <(find scripts -type f -name '*.py' 2>/dev/null || true)
          if [ "${#py[@]}" -eq 0 ]; then
            echo "No Python scripts under scripts/"
            exit 0
          fi
          python3 -m py_compile "${py[@]}"
          echo "OK: py_compile ok (${#py[@]} files)"

      - name: Shell syntax (scripts/**/*.sh)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t shs < <(find scripts -type f -name '*.sh' 2>/dev/null || true)
          if [ "${#shs[@]}" -eq 0 ]; then
            echo "No shell scripts under scripts/"
            exit 0
          fi
          for f in "${shs[@]}"; do
            bash -n "$f"
          done
          echo "OK: bash -n ok (${#shs[@]} files)"

      - name: CI classifier and tooling tests
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'

      - name: Install actionlint
        if: needs.changes.outputs.run_actionlint == 'true'
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint GitHub workflows
        if: needs.changes.outputs.run_actionlint == 'true'
        run: '"$(go env GOPATH)/bin/actionlint" -shellcheck= -pyflakes='

      # Workflow security: unpinned actions, template injection into shell,
      # over-broad token permissions. High severity fails the job.
      - name: Audit GitHub workflows (zizmor)
        if: needs.changes.outputs.run_actionlint == 'true'
        run: pipx run zizmor==1.32.0 --offline --min-severity high --format github .github/workflows

  # Anti-overfitting / owner-boundary lint
  pass-gate-lint:
    name: Pass-Gate Lint (anti-overfitting)
    needs: [changes]
    if: needs.changes.outputs.run_pass_gate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false
          submodules: false

      - name: Check for function/address-specific patterns in NIR pipeline
        run: |
          set -euo pipefail
          PATTERN_HITS=$(grep -rn \
            -e 'func_name\s*==' \
            -e 'func_name\.contains' \
            -e 'function_name.*==\|==.*function_name' \
            -e 'addr\s*==\s*0x[0-9a-fA-F]' \
            crates/fission-pcode/src/midend/structuring/ \
            crates/fission-pcode/src/midend/normalize/ \
            crates/fission-midend-structuring/src/ \
            crates/fission-midend-normalize/src/ 2>/dev/null || true)
          if [ -n "$PATTERN_HITS" ]; then
            echo "ERROR: Function/address-specific pattern detected in NIR pipeline:"
            echo "$PATTERN_HITS"
            exit 1
          fi
          echo "OK: No function/address-specific patterns found in NIR pipeline."

      - name: Verify MAX_STRUCTURING_PASSES constant is declared
        run: |
          set -euo pipefail
          if ! grep -q 'MAX_STRUCTURING_PASSES' crates/fission-pcode/src/midend/pass/manager.rs; then
            echo "ERROR: MAX_STRUCTURING_PASSES constant missing from midend/pass/manager.rs"
            exit 1
          fi
          CAP=$(grep 'MAX_STRUCTURING_PASSES.*usize.*=' crates/fission-pcode/src/midend/pass/manager.rs \
                | grep -oE '[0-9]+' | head -1)
          echo "OK: MAX_STRUCTURING_PASSES = ${CAP} (current cap)."

      - name: Owner boundary scan (ADR 0008 / 0011 / 0012)
        run: |
          set -euo pipefail
          chmod +x scripts/check/owner_boundaries.sh
          ./scripts/check/owner_boundaries.sh

      # CI-only PRs also exercise this shallow-checkout comparison.
      - name: Collect PR changes for scoped gates
        id: pr_changes
        if: github.event_name == 'pull_request' && (needs.changes.outputs.run_tests == 'true' || needs.changes.outputs.lane == 'ci')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Pull-request checkouts use a synthetic merge commit. Fetching only
          # the base tip does not guarantee a merge base, so compare trees.
          git fetch --no-tags origin "$BASE_REF" --depth=1
          BASE_SHA=$(git rev-parse FETCH_HEAD)
          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "Changed paths relative to fetched base $BASE_SHA:"
          printf '%s\n' "$CHANGED"

          # Consume the complete input: grep -q can close the pipe early and
          # make git diff fail with SIGPIPE under pipefail despite a match.
          NIR_RENDER_MIDEND_CHANGED=false
          HAS_TARGETED_TEST=false
          SLEIGH_CHANGED=false

          # Rust sources only: a manifest edit (a version bump, a dependency
          # drop) changes no NIR semantics, and counting it blocked release
          # PRs for want of a test there is nothing to write for.
          if printf '%s\n' "$CHANGED" | grep '\.rs$' | grep -e "^crates/fission-pcode/src/midend/" \
              -e "^crates/fission-pcode/src/render/" \
              -e "^crates/fission-midend-structuring/" \
              -e "^crates/fission-midend-normalize/" \
              -e "^crates/fission-midend-core/" >/dev/null; then
            NIR_RENDER_MIDEND_CHANGED=true
            # Lines of code the change adds there, blank lines and comments
            # aside. A change that only removes code (a duplicate definition,
            # dead code) has nothing new for a test to target.
            ADDED_CODE=$(git diff --unified=0 "$BASE_SHA" HEAD -- \
                crates/fission-pcode/src/midend/ crates/fission-pcode/src/render/ \
                crates/fission-midend-structuring/ crates/fission-midend-normalize/ \
                crates/fission-midend-core/ \
                | grep '^+[^+]' | grep -cvE '^\+[[:space:]]*(//.*)?$' || true)
            if [ "$ADDED_CODE" -eq 0 ]; then
              echo "INFO: NIR/render/midend change adds no code; no targeted test required."
              HAS_TARGETED_TEST=true
            elif printf '%s\n' "$CHANGED" | grep -e "tests/" -e ".*test" -e ".*_tests\.rs" >/dev/null; then
              HAS_TARGETED_TEST=true
            elif git diff "$BASE_SHA" HEAD -- \
                crates/fission-pcode/src/midend/ crates/fission-pcode/src/render/ \
                crates/fission-midend-structuring/ crates/fission-midend-normalize/ \
                crates/fission-midend-core/ \
                | grep "+.*#\[test\]" >/dev/null; then
              HAS_TARGETED_TEST=true
            fi
          fi

          if printf '%s\n' "$CHANGED" | grep -e "^crates/fission-sleigh/" -e "^utils/sleigh-specs/" >/dev/null; then
            SLEIGH_CHANGED=true
          fi

          {
            echo "nir_render_midend_changed=$NIR_RENDER_MIDEND_CHANGED"
            echo "has_targeted_test=$HAS_TARGETED_TEST"
            echo "sleigh_changed=$SLEIGH_CHANGED"
          } >> "$GITHUB_OUTPUT"

      - name: Enforce Targeted Tests for NIR/Render Changes
        if: github.event_name == 'pull_request' && needs.changes.outputs.run_tests == 'true'
        env:
          NIR_RENDER_MIDEND_CHANGED: ${{ steps.pr_changes.outputs.nir_render_midend_changed }}
          HAS_TARGETED_TEST: ${{ steps.pr_changes.outputs.has_targeted_test }}
        run: |
          set -euo pipefail
          if [ "$NIR_RENDER_MIDEND_CHANGED" = "true" ]; then
            if [ "$HAS_TARGETED_TEST" = "true" ]; then
              echo "OK: Targeted tests included."
            else
              echo "ERROR: Targeted test missing for NIR/render/midend changes."
              exit 1
            fi
          else
            echo "INFO: No NIR/render/midend changes detected."
          fi

      - name: Enforce Sleigh Exact Match Parity
        if: github.event_name == 'pull_request' && needs.changes.outputs.run_tests == 'true'
        env:
          SLEIGH_CHANGED: ${{ steps.pr_changes.outputs.sleigh_changed }}
        run: |
          set -euo pipefail
          if [ "$SLEIGH_CHANGED" = "true" ]; then
            echo "INFO: Sleigh changes detected. Parity enforcement active via fission-sleigh tests."
          else
            echo "INFO: No Sleigh changes detected."
          fi

  # Step 2: Core Tests (Linux)
  test-linux:
    name: Tests (Linux)
    needs: [changes]
    if: needs.changes.outputs.run_tests == 'true'
    uses: ./.github/workflows/reusable-run-tests.yml
    with:
      os: ubuntu-latest
      crates: ${{ needs.changes.outputs.test_crates }}
      profile: debug
      run_interactive_runtime_tests: ${{ needs.changes.outputs.run_interactive_runtime_tests == 'true' }}
      run_script_emulator_tests: ${{ needs.changes.outputs.run_script_emulator_tests == 'true' }}
      run_emulator_softfloat_check: ${{ needs.changes.outputs.run_emulator_softfloat_check == 'true' }}
      run_plugin_interactive_check: ${{ needs.changes.outputs.run_plugin_interactive_check == 'true' }}
      run_cli_alt_feature_checks: ${{ needs.changes.outputs.run_cli_alt_feature_checks == 'true' }}
      # Doctests and optional-feature suites run beside nextest, not after it.
      parallel_lanes: true

  # Native debugger tests are feature-gated and exercise OS process control.
  # Keep them out of unrelated Rust changes, but always run them when the
  # dynamic debugger, its CLI surface, or its ELF loader facts change.
  test-linux-debugger:
    name: Native Debugger Tests (Linux)
    needs: [changes]
    if: needs.changes.outputs.run_debugger_tests == 'true'
    uses: ./.github/workflows/reusable-run-tests.yml
    with:
      os: ubuntu-latest
      crates: "fission-dynamic,fission-cli"
      features: "fission-dynamic/interactive_runtime,fission-cli/debugger"
      profile: debug

  cli-smoke-linux:
    name: CLI Smoke (Linux · PE sample)
    needs: [changes, test-linux]
    if: needs.changes.outputs.run_cli_smoke == 'true'
    uses: ./.github/workflows/reusable-cli-smoke.yml
    with:
      profile: debug

  # macOS test smoke: main push + dispatch, rust/utils lane only.
  # Release CLI builds are owned by CI Heavy; these jobs keep platform test
  # coverage without compiling the same CLI a second time in Fast Gate.
  test-macos:
    name: Tests (macOS)
    needs: [changes]
    if: needs.changes.outputs.run_macos_test == 'true'
    uses: ./.github/workflows/reusable-run-tests.yml
    with:
      os: macos-latest
      crates: "fission-midend-structuring,fission-pcode,fission-loader"
      profile: debug

  platform-debugger:
    needs: [changes]
    if: needs.changes.outputs.run_platform_debugger == 'true'
    uses: ./.github/workflows/reusable-premerge.yml
    with:
      suite: native-debugger

  solver-diff:
    needs: [changes]
    if: needs.changes.outputs.run_solver_diff == 'true'
    uses: ./.github/workflows/reusable-premerge.yml
    with:
      suite: solver

  loader-fixtures:
    needs: [changes]
    if: needs.changes.outputs.run_loader_fixtures == 'true'
    uses: ./.github/workflows/reusable-premerge.yml
    with:
      suite: loader

  decomp-corpus:
    needs: [changes]
    if: needs.changes.outputs.run_decomp_corpus == 'true'
    uses: ./.github/workflows/reusable-premerge.yml
    with:
      suite: decompiler

  package-check:
    name: Package candidate rehearsal
    needs: [changes]
    if: needs.changes.outputs.run_package_check == 'true'
    uses: ./.github/workflows/cd.yml
    with:
      source_sha: ${{ github.sha }}
      version: v0.0.0-dryrun

  # The nightly full-dataset sweep, run on one binary when its definition changes.
  sweep-smoke:
    name: DecBench sweep smoke
    needs: [changes]
    if: needs.changes.outputs.run_sweep_smoke == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-decbench-sweep.yml
    with:
      only: binaries/O0/base-passwd/update-passwd

  # Report-only, not part of CI Summary: what a Rust change does to decompile
  # cost (instructions executed) and, for decompiler changes, to output.
  base-vs-head:
    needs: [changes]
    if: needs.changes.outputs.run_tests == 'true' && github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-base-head.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}
      output_diff: ${{ needs.changes.outputs.run_decomp_corpus == 'true' }}

  # Final summary — lane-aware required jobs
  ci-summary:
    name: CI Summary
    needs:
      [
        changes,
        doc-checks,
        replay-checks,
        security-check,
        lint-format,
        script-checks,
        pass-gate-lint,
        test-linux,
        test-linux-debugger,
        cli-smoke-linux,
        test-macos,
        platform-debugger,
        solver-diff,
        loader-fixtures,
        decomp-corpus,
        package-check,
        sweep-smoke,
      ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Status
        run: |
          set -euo pipefail
          CHANGES_RESULT="${{ needs.changes.result }}"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "ERROR: Change detection failed (result=${CHANGES_RESULT})"
            exit 1
          fi

          LANE="${{ needs.changes.outputs.lane }}"
          case "$LANE" in
            docs|scripts|ci|rust) ;;
            *)
              echo "ERROR: Change detection returned an unknown lane: '${LANE}'"
              exit 1
              ;;
          esac
          echo "Lane: ${LANE}"

          require_if() {
            local enabled="$1"
            local name="$2"
            local result="$3"
            if [ "$enabled" != "true" ]; then
              echo "INFO: ${name} not required (result=${result})"
              return 0
            fi
            if [ "$result" = "skipped" ]; then
              echo "ERROR: ${name} was required but skipped"
              return 1
            fi
            if [ "$result" != "success" ]; then
              echo "ERROR: ${name} failed (result=${result})"
              return 1
            fi
            echo "OK: ${name}"
          }

          FAILED=0
          require_if "${{ needs.changes.outputs.run_doc_checks }}" "Documentation examples and schemas" "${{ needs.doc-checks.result }}" || FAILED=1
          require_if "${{ needs.changes.outputs.run_replay_checks }}" "Native fixture replay and Python port" "${{ needs.replay-checks.result }}" || FAILED=1
          require_if "${{ needs.changes.outputs.run_security }}" "Security" "${{ needs.security-check.result }}" || FAILED=1
          require_if "${{ needs.changes.outputs.run_lint }}" "Lint/format" "${{ needs.lint-format.result }}" || FAILED=1
          require_if "${{ needs.changes.outputs.run_script_checks }}" "Script checks" "${{ needs.script-checks.result }}" || FAILED=1
          require_if "${{ needs.changes.outputs.run_pass_gate }}" "Pass-gate lint" "${{ needs.pass-gate-lint.result }}" || FAILED=1
          require_if "${{ needs.changes.outputs.run_tests }}" "Linux tests" "${{ needs.test-linux.result }}" || FAILED=1
          require_if "${{ needs.changes.outputs.run_debugger_tests }}" "Linux debugger tests" "${{ needs.test-linux-debugger.result }}" || FAILED=1
          require_if "${{ needs.changes.outputs.run_cli_smoke }}" "CLI smoke" "${{ needs.cli-smoke-linux.result }}" || FAILED=1
          require_if "${{ needs.changes.outputs.run_macos_test }}" "macOS tests" "${{ needs.test-macos.result }}" || FAILED=1

          require_if "${{ needs.changes.outputs.run_platform_debugger }}" "platform-debugger" "${{ needs.platform-debugger.result }}" || FAILED=1
          require_if "${{ needs.changes.outputs.run_solver_diff }}" "solver-diff" "${{ needs.solver-diff.result }}" || FAILED=1
          require_if "${{ needs.changes.outputs.run_loader_fixtures }}" "loader-fixtures" "${{ needs.loader-fixtures.result }}" || FAILED=1
          require_if "${{ needs.changes.outputs.run_decomp_corpus }}" "decomp-corpus" "${{ needs.decomp-corpus.result }}" || FAILED=1
          require_if "${{ needs.changes.outputs.run_package_check }}" "Package rehearsal" "${{ needs.package-check.result }}" || FAILED=1
          require_if "${{ needs.changes.outputs.run_sweep_smoke }}" "DecBench sweep smoke" "${{ needs.sweep-smoke.result }}" || FAILED=1

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "OK: Fast Gate passed for lane=${LANE}"
          echo "INFO: PR platform tests are deferred to main L0 + L1 Heavy when applicable."
