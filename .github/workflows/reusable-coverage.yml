name: Reusable Code Coverage

# Generates LLVM-based code coverage using cargo-llvm-cov.
# Produces HTML + LCOV reports and uploads as artifacts.
# Coverage threshold: warn (not fail) if fission-pcode drops below 60%.

on:
  workflow_call:
    inputs:
      crates:
        type: string
        required: false
        default: "fission-pcode,fission-loader"
        description: "Crates to measure coverage for (comma-separated)"
      warn_threshold_pct:
        type: number
        required: false
        default: 60
        description: "Coverage warn threshold % for fission-pcode (warning only, not failure)"
    outputs:
      coverage_status:
        description: "Explicit diagnostic status (measured_pass, measured_below_threshold, missing_evidence, malformed_evidence, checker_error)"
        value: ${{ jobs.coverage.outputs.coverage_status }}
      coverage_detail:
        description: "Human-readable coverage diagnostic summary"
        value: ${{ jobs.coverage.outputs.coverage_detail }}
      target_pct:
        description: "Measured line coverage percentage for fission-pcode, or empty if unavailable"
        value: ${{ jobs.coverage.outputs.target_pct }}

env:
  FISSION_IN_CRATES: ${{ inputs.crates }}
  FISSION_IN_WARN_THRESHOLD_PCT: ${{ inputs.warn_threshold_pct }}
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Coverage is diagnostic; tool or infrastructure failures must not block L1.
    continue-on-error: true
    outputs:
      coverage_status: ${{ steps.summarize.outputs.coverage_status }}
      coverage_detail: ${{ steps.summarize.outputs.coverage_detail }}
      target_pct: ${{ steps.summarize.outputs.target_pct }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        with:
          lfs: false
          submodules: recursive


      - name: Setup Utils
        uses: ./.github/actions/setup-utils
      - name: Install Rust (stable + llvm-tools)
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache Rust Build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@a138c079db095d22c78af31fc3e0890136adf687 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov

      - name: Install system dependencies (Linux headless)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libssl-dev \
            build-essential \
            pkg-config

      - name: Generate coverage report (HTML + LCOV)
        id: generate
        shell: bash
        run: |
          crates="${FISSION_IN_CRATES}"
          crate_flags=()
          IFS=',' read -ra CRATE_ARRAY <<< "$crates"
          for crate in "${CRATE_ARRAY[@]}"; do
            crate="$(echo "$crate" | tr -d '[:space:]')"
            crate_flags+=(-p "$crate")
          done

          # One instrumented run, then one report per format. cargo-llvm-cov
          # refuses `--html` and `--lcov` in the same invocation, and this
          # step asked for both -- so the scheduled run failed before it
          # measured anything, and the threshold check below never had a
          # file to read.
          cargo llvm-cov \
            "${crate_flags[@]}" \
            --locked \
            --no-report
          mkdir -p coverage
          cargo llvm-cov report --html --output-dir coverage/html
          cargo llvm-cov report --lcov --output-path coverage/lcov.info

      - name: Summarize coverage and check advisory threshold
        id: summarize
        if: always()
        shell: bash
        run: |
          python3 scripts/ci/coverage_summary.py \
            --lcov coverage/lcov.info \
            --target-crate fission-pcode \
            --generate-outcome "${{ steps.generate.outcome }}" \
            --json-out coverage/summary.json

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage/
          retention-days: 30
          if-no-files-found: warn
