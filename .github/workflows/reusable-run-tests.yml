name: Reusable Run Tests

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: false
        default: ubuntu-latest
      crates:
        type: string
        required: false
        description: "Specific crates to test (comma-separated, e.g. fission-pcode,fission-loader)"
      features:
        type: string
        required: false
        default: ""
        description: "Cargo features to enable for the selected packages"
      profile:
        type: string
        required: false
        default: "debug"
        description: "Build profile: debug or release"
      exclude_crates:
        type: string
        required: false
        default: "fission-static"
        description: "Crates to exclude from full suite"
      timeout_minutes:
        type: number
        required: false
        default: 45
        description: "Job timeout; raise on slow runners (e.g. Windows release tests)"
      retries:
        type: number
        required: false
        default: 1
        description: "nextest --retries for flaky tests (1 = one retry)"
      install_gui_sysdeps:
        type: boolean
        required: false
        default: false
        description: "Install webkit/GTK sysdeps (only needed for dioxus / full GUI workspace)"
      run_interactive_runtime_tests:
        type: boolean
        required: false
        default: false
        description: "Run the interactive-runtime feature suite when an owner is affected"
      run_script_emulator_tests:
        type: boolean
        required: false
        default: false
        description: "Run the script-emulator feature suite when an owner is affected"
      run_emulator_softfloat_check:
        type: boolean
        required: false
        default: false
        description: "Compile the emulator softfloat feature when its owner is affected"
      run_plugin_interactive_check:
        type: boolean
        required: false
        default: false
        description: "Compile the plugin interactive-runtime feature when its owner is affected"
      run_cli_alt_feature_checks:
        type: boolean
        required: false
        default: false
        description: "Compile alternate CLI feature configurations when the CLI is affected"
      parallel_lanes:
        type: boolean
        required: false
        default: false
        description: >-
          Split the job into two concurrent lanes: "core" (nextest) and "extras"
          (doctests and the optional-feature suites). Each lane pays its own
          checkout/toolchain/cache setup, so enable it only where the extras are
          long enough to outweigh that. Off: one job runs everything in order.

env:
  FISSION_IN_EXCLUDE_CRATES: ${{ inputs.exclude_crates }}
  FISSION_IN_FEATURES: ${{ inputs.features }}
  FISSION_IN_RETRIES: ${{ inputs.retries }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: "1"
  # A test whose external input (python3; on macOS, `swift demangle`) is
  # absent fails here instead of returning early, which nextest would count
  # as a pass. See crates/fission-core/src/test_inputs.rs.
  FISSION_REQUIRE_TEST_INPUTS: "1"

jobs:
  test:
    # The single-lane job keeps its historical name.
    name: ${{ matrix.lane == 'all' && 'test' || format('test ({0})', matrix.lane) }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(inputs.parallel_lanes && '["core","extras"]' || '["all"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false
          # wiki submodule is not needed for crate tests
          submodules: false

      - name: Setup Utils
        uses: ./.github/actions/setup-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Setup sccache
        id: sccache
        uses: ./.github/actions/setup-sccache

      - name: Cache Rust Build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Share cache across Fast Gate / Heavy jobs on the same OS+profile.
          # The extras lane builds different targets (doctests, feature
          # variants); a separate key stops the two lanes racing to save one
          # cache entry and discarding the loser's artifacts.
          shared-key: fission-test-${{ runner.os }}-${{ inputs.profile }}${{ matrix.lane == 'extras' && '-extras' || '' }}
          cache-on-failure: true

      - name: Install cargo-nextest
        if: ${{ matrix.lane != 'extras' || inputs.run_interactive_runtime_tests || inputs.run_script_emulator_tests }}
        uses: taiki-e/install-action@11535f61e49cc8fdbdbb5aacee608b494b699f42 # nextest
        with:
          tool: nextest

      - name: Install system dependencies (Linux · base)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libssl-dev \
            build-essential \
            file \
            pkg-config

      - name: Install system dependencies (Linux · GUI)
        if: runner.os == 'Linux' && inputs.install_gui_sysdeps
        run: |
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev

      # macOS runners use Bash 3.2, where `set -u` rejects direct expansion of
      # an empty array. Keep array expansions in the `${array[@]+...}` form.
      # --- Specific crates mode (single cargo/nextest process) ---
      - name: Run Tests (Specific Crates) [nextest]
        if: ${{ inputs.crates != '' && matrix.lane != 'extras' }}
        shell: bash
        env:
          CRATES: ${{ inputs.crates }}
          FEATURES: ${{ inputs.features }}
          RETRIES: ${{ inputs.retries }}
          PROFILE: ${{ inputs.profile }}
        run: bash scripts/ci/test_crates.sh nextest

      # Doctests: nextest does not run doctests — run once with multi -p
      - name: Run Doctests (Specific Crates)
        if: ${{ inputs.crates != '' && matrix.lane != 'core' }}
        shell: bash
        env:
          CRATES: ${{ inputs.crates }}
          FEATURES: ${{ inputs.features }}
          PROFILE: ${{ inputs.profile }}
        run: bash scripts/ci/test_crates.sh doc

      # --- Full workspace mode ---
      - name: Run Full Test Suite (All Crates) [nextest]
        if: ${{ inputs.crates == '' && matrix.lane != 'extras' }}
        shell: bash
        run: |
          set -euo pipefail
          features="${FISSION_IN_FEATURES}"
          feature_flags=()
          if [ -n "$features" ]; then
            feature_flags+=(--features "$features")
          fi
          exclude_flags=()
          if [ -n "${FISSION_IN_EXCLUDE_CRATES}" ]; then
            IFS=',' read -ra EX <<< "${FISSION_IN_EXCLUDE_CRATES}"
            for c in "${EX[@]+"${EX[@]}"}"; do
              c="$(echo "$c" | tr -d '[:space:]')"
              [ -z "$c" ] && continue
              exclude_flags+=(--exclude "$c")
            done
          fi
          cargo nextest run \
            --workspace \
            "${feature_flags[@]+"${feature_flags[@]}"}" \
            "${exclude_flags[@]+"${exclude_flags[@]}"}" \
            --locked \
            --no-tests=fail \
            --no-fail-fast \
            --retries ${FISSION_IN_RETRIES} \
            ${{ inputs.profile == 'release' && '--release' || '' }}
          # fission-static is often excluded from workspace GUI path; still test it.
          if echo "${FISSION_IN_EXCLUDE_CRATES}" | tr ',' '\n' | grep -qx 'fission-static'; then
            cargo nextest run \
              -p fission-static \
              "${feature_flags[@]+"${feature_flags[@]}"}" \
              --locked \
              --no-tests=fail \
            --no-fail-fast \
              --retries ${FISSION_IN_RETRIES} \
              ${{ inputs.profile == 'release' && '--release' || '' }}
          fi

      - name: Run Workspace Doctests
        if: ${{ inputs.crates == '' && matrix.lane != 'core' }}
        shell: bash
        run: |
          cargo test --doc --workspace --locked \
            ${{ inputs.profile == 'release' && '--release' || '' }}

      # These suites exercise non-default features. Fast Gate enables each only
      # when the feature owner or one of its dependencies is affected.
      - name: Test optional features (interactive_runtime)
        if: ${{ inputs.run_interactive_runtime_tests && matrix.lane != 'core' }}
        shell: bash
        run: bash scripts/ci/feature_suite.sh interactive_runtime

      - name: Test optional features (script emulator)
        if: ${{ inputs.run_script_emulator_tests && matrix.lane != 'core' }}
        shell: bash
        run: bash scripts/ci/feature_suite.sh script_emulator

      - name: Check optional feature (emulator softfloat)
        if: ${{ inputs.run_emulator_softfloat_check && matrix.lane != 'core' }}
        shell: bash
        run: bash scripts/ci/feature_suite.sh emulator_softfloat

      - name: Check optional feature (plugin interactive_runtime)
        if: ${{ inputs.run_plugin_interactive_check && matrix.lane != 'core' }}
        shell: bash
        run: bash scripts/ci/feature_suite.sh plugin_interactive

      - name: Check alternate CLI feature configurations
        if: ${{ inputs.run_cli_alt_feature_checks && matrix.lane != 'core' }}
        shell: bash
        run: bash scripts/ci/feature_suite.sh cli_alt

      # Only when the build used sccache: otherwise this would start a server.
      - name: sccache stats
        if: always() && steps.sccache.outputs.enabled == 'true'
        shell: bash
        run: sccache --show-stats || true
