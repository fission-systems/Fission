name: Reusable pre-merge runtime gates

on:
  workflow_call:
    inputs:
      suite:
        required: true
        type: string

permissions:
  contents: read

jobs:
  native-debugger:
    if: inputs.suite == 'native-debugger'
    name: Debugger process control (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-utils
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: native-debugger-${{ runner.os }}
      - uses: taiki-e/install-action@11535f61e49cc8fdbdbb5aacee608b494b699f42 # nextest
        with:
          tool: nextest
      - name: Linux live debugger
        if: runner.os == 'Linux'
        run: cargo nextest run --locked --no-tests=fail -p fission-dynamic --features interactive_runtime --test linux_debug_launch
      - name: Windows live debugger
        if: runner.os == 'Windows'
        run: cargo nextest run --locked --no-tests=fail -p fission-dynamic --features windows_native_debugger -E 'test(windows_native_backend_)'
      - name: macOS live debugger
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # Developer Tools alone is not enough on a hosted runner: task_for_pid
          # still waits for an authorization nobody can grant and times out.
          # The runner user must be in _developer and the taskport right open.
          sudo -n DevToolsSecurity -enable
          sudo -n dseditgroup -o edit -a "$(id -un)" -t user _developer
          sudo -n security authorizationdb write system.privilege.taskport allow
          scripts/macos/run-live-debugger-tests.sh

  solver:
    if: inputs.suite == 'solver'
    name: Solver differential (Z3)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      FISSION_DIFF_CASES: "12"
      FISSION_DIFF_DEPTH: "2"
      FISSION_DIFF_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@11535f61e49cc8fdbdbb5aacee608b494b699f42 # nextest
        with:
          tool: nextest
      - name: Install Z3 4.13.4
        run: |
          set -euo pipefail
          archive=z3-4.13.4-x64-glibc-2.35
          curl --fail --location --retry 3 "https://github.com/Z3Prover/z3/releases/download/z3-4.13.4/${archive}.zip" -o "$RUNNER_TEMP/z3.zip"
          unzip -q "$RUNNER_TEMP/z3.zip" -d "$RUNNER_TEMP"
          binary="$RUNNER_TEMP/$archive/bin/z3"
          "$binary" -version | grep -F 'Z3 version 4.13.4'
          echo "FISSION_Z3=$binary" >> "$GITHUB_ENV"
      - name: Compare bit-vectors and arrays
        run: |
          cargo nextest run --locked --no-tests=fail --release -p fission-solver --test differential_z3 --run-ignored only \
            -E 'test(the_solver_agrees_with_z3_on_random_bitvector_formulas) | test(array_formulas_agree_with_z3)'

  # Single instructions on the real CPU against Fission's SLEIGH lift and
  # p-code interpreter (crates/fission-emulator/tests/native_differential).
  # The CPU does not read SLEIGH, so it catches spec errors Ghidra and
  # `fission_cli verify` share (ADR 0017). Fails on a divergence missing from
  # baseline.txt and on a baseline entry that no longer reproduces.
  native-diff:
    if: inputs.suite == 'native-diff'
    name: Native differential (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-utils
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: native-diff-${{ matrix.os }}
      - uses: taiki-e/install-action@11535f61e49cc8fdbdbb5aacee608b494b699f42 # nextest
        with:
          tool: nextest
      - name: Build
        run: cargo nextest run --locked --no-run -p fission-emulator --test native_differential
      - name: Compare against the CPU
        run: cargo nextest run --locked --no-tests=fail -p fission-emulator --test native_differential --no-capture

  fixtures:
    if: inputs.suite == 'loader' || inputs.suite == 'decompiler'
    name: Binary fixtures (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.suite == 'loader' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    env:
      FISSION_BENCHMARK_NO_CACHE: "1"
      # Release speed with the checks a debug build has: integer overflow and
      # debug assertions panic instead of wrapping silently. A plain release
      # build hid real overflows (a debug sweep found four panic sites; the
      # ELF fuzz target found another).
      CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
      CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-utils
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: premerge-fixtures-${{ runner.os }}
      - name: Build release CLI
        run: cargo build --locked --release -p fission-cli
      - name: Check ELF and PE fixtures
        if: runner.os == 'Linux'
        run: |
          python3 scripts/ci/decompiler_smoke.py target/release/fission_cli crates/fission-sleigh/testdata/a64_csel_select.so --symbol sel_two
          python3 scripts/ci/decompiler_smoke.py target/release/fission_cli crates/fission-loader/testdata/x64_pdb_struct_test.exe --symbol start
      - name: Check x86-64 ELF fixture
        if: inputs.suite == 'decompiler'
        run: python3 scripts/ci/decompiler_smoke.py target/release/fission_cli crates/fission-sleigh/testdata/x64_stale_arg_register.elf
      - name: Check Mach-O fixture
        if: runner.os == 'macOS'
        run: |
          clang -O0 -g .github/fixtures/test_functions.c -o "$RUNNER_TEMP/macho-smoke"
          python3 scripts/ci/decompiler_smoke.py target/release/fission_cli "$RUNNER_TEMP/macho-smoke" --symbol main
