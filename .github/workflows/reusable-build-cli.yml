name: Reusable Build CLI

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: false
        default: ubuntu-latest
      target:
        type: string
        required: false
        description: "Cargo build target (e.g., x86_64-pc-windows-msvc)"
      profile:
        type: string
        required: false
        default: "release"
        description: "Build profile: release or debug"
      upload_artifact:
        type: boolean
        required: false
        default: true
        description: "Upload artifact to GitHub Actions"

env:
  FISSION_IN_PROFILE: ${{ inputs.profile }}
  FISSION_IN_TARGET: ${{ inputs.target }}
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false
          submodules: false

      - name: Setup Utils
        uses: ./.github/actions/setup-utils
      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ inputs.target || '' }}

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Cache Rust Build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: fission-cli-${{ runner.os }}-${{ inputs.profile }}
          cache-on-failure: true

      - name: Build fission-cli (${{ inputs.profile }})
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "${FISSION_IN_PROFILE}" = "release" ]; then args+=(--release); fi
          if [ -n "${FISSION_IN_TARGET}" ]; then args+=(--target "${FISSION_IN_TARGET}"); fi
          cargo build -p fission-cli --locked ${args[@]+"${args[@]}"} --verbose

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Locate Binary
        id: locate
        shell: bash
        run: |
          if [ "${FISSION_IN_PROFILE}" = "release" ]; then
            PROFILE_DIR="release"
          else
            PROFILE_DIR="debug"
          fi

          TARGET="${FISSION_IN_TARGET}"
          if [ -n "$TARGET" ]; then
            TARGET_DIR="target/$TARGET/$PROFILE_DIR"
          else
            TARGET_DIR="target/$PROFILE_DIR"
          fi
          
          if [ "${{ runner.os }}" = "Windows" ]; then
            BINARY_NAME="fission_cli.exe"
          else
            BINARY_NAME="fission_cli"
          fi
          
          BINARY_PATH="$TARGET_DIR/$BINARY_NAME"
          
          if [ -f "$BINARY_PATH" ]; then
            SIZE=$(du -h "$BINARY_PATH" | cut -f1)
            echo "binary_path=$BINARY_PATH" >> $GITHUB_OUTPUT
            echo "binary_name=$BINARY_NAME" >> $GITHUB_OUTPUT
            echo "size=$SIZE" >> $GITHUB_OUTPUT
            echo "ok: Binary ready: $BINARY_PATH ($SIZE)"
          else
            echo "error: Binary not found: $BINARY_PATH"
            exit 1
          fi

      - name: Print Binary Info
        run: |
          echo "Binary: ${{ steps.locate.outputs.binary_name }}"
          echo "Path: ${{ steps.locate.outputs.binary_path }}"
          echo "Size: ${{ steps.locate.outputs.size }}"

      - name: Upload Binary Artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fission-cli-${{ inputs.os }}-${{ inputs.profile }}-${{ github.sha }}
          path: ${{ steps.locate.outputs.binary_path }}
          retention-days: 7
          if-no-files-found: warn
