name: Label PR areas

# Adds area:* labels from the paths a pull request changes (.github/labeler.yml).
# pull_request, not pull_request_target: no PR code is checked out or run, and
# a fork PR's read-only token simply cannot label (the job then fails harmlessly).
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: label-areas-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false
          dot: true
