name: DecBench full dataset sweep

on:
  schedule:
    - cron: "25 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: decbench-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sweep:
    uses: ./.github/workflows/reusable-decbench-sweep.yml

  notify:
    needs: sweep
    if: always()
    permissions:
      issues: write
    uses: ./.github/workflows/reusable-report-red.yml
    with:
      result: ${{ needs.sweep.result }}
      detail: "the decbench-full artifact holds summary.json and changed.jsonl"
