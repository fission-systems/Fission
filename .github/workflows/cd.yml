name: Build and verify release packages

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.version }}
  SOURCE_SHA: ${{ inputs.source_sha }}

jobs:
  build-packages:
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds on the oldest supported Ubuntu so the glibc floor is
          # 2.35 (Debian 12, Ubuntu 22.04 and newer), not the runner's latest.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            exe: fission_cli
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            exe: fission_cli
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: fission_cli
          - os: macos-15-intel
            target: x86_64-apple-darwin
            exe: fission_cli
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: fission_cli.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verify source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Setup Utils
        uses: ./.github/actions/setup-utils
      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust Build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build fission-cli (Release)
        run: cargo build -p fission-cli --locked --release --target ${{ matrix.target }}

      - name: Release CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          CLI="target/${{ matrix.target }}/release/${{ matrix.exe }}"
          test -s "${CLI}"
          "${CLI}" --version

      - name: Benchmark consumer smoke (Linux x64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          FISSION_SLEIGH_SPEC_DIR: ${{ github.workspace }}/utils/sleigh-specs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
          BIN="/tmp/fission-release-smoke/test_functions.exe"
          mkdir -p "$(dirname "${BIN}")"
          x86_64-w64-mingw32-gcc -O2 -g -m64 -static \
            .github/fixtures/test_functions.c \
            -o "${BIN}"
          CLI="target/${{ matrix.target }}/release/${{ matrix.exe }}"
          "${CLI}" info "${BIN}"
          "${CLI}" list "${BIN}" --json
          ADDR="$("${CLI}" list "${BIN}" --json | python3 .github/scripts/pick_pe_smoke_decomp_addr.py)"
          OUT=$("${CLI}" decomp "${BIN}" --addr "${ADDR}" --profile speed --timeout-ms 180000 --json)
          echo "${OUT}" | python3 .github/scripts/check_decomp_output.py
          SESSION=$("${CLI}" debug --emulator session "${BIN}" -c step -c step -c regs --json)
          echo "${SESSION}" | python3 .github/scripts/check_debug_session.py

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/release/package.sh binary "${{ matrix.target }}" \
            "target/${{ matrix.target }}/release/${{ matrix.exe }}" dist

      # Unpacked outside the checkout, run from an unrelated directory with
      # no FISSION_* environment: what a user does. The v0.2.x flat layout
      # failed exactly this and nothing ran it.
      - name: Packaged archive smoke
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ext=tar.gz
          if [[ "${TARGET}" == *windows* ]]; then ext=zip; fi
          bash scripts/release/smoke_package.sh "dist/fission-${TARGET}.${ext}" \
            crates/fission-sleigh/testdata/a64_csel_select.so

      - name: install.sh smoke (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          prefix="$(mktemp -d)/prefix"
          (cd "$(mktemp -d)" && FISSION_PREFIX="${prefix}" \
            FISSION_ARCHIVE="${GITHUB_WORKSPACE}/dist/fission-${{ matrix.target }}.tar.gz" \
            sh "${GITHUB_WORKSPACE}/install.sh")
          (cd "$(mktemp -d)" && env -u FISSION_ROOT "${prefix}/bin/fission_cli" \
            decomp "${GITHUB_WORKSPACE}/crates/fission-sleigh/testdata/a64_csel_select.so" --all \
            | grep -q "Function:")

      - name: Bare Linux CLI asset (benchmark consumers)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          name=fission_cli-x86_64-unknown-linux-gnu
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "dist/${name}"
          chmod +x "dist/${name}"
          (cd dist && sha256sum "${name}" > "${name}.sha256")

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  resources-and-formula:
    name: Resource bundle & Homebrew formula
    needs: [build-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Setup Utils
        uses: ./.github/actions/setup-utils

      - name: Collect archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Resource bundle
        run: bash scripts/release/package.sh resources dist

      # A cargo-install user's layout: the binary in <root>/bin, resources
      # unpacked into <root>/share/fission.
      - name: Resource bundle smoke
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          mkdir -p "${root}/bin" "${root}/share/fission"
          tar -C "${root}/share/fission" -xzf dist/fission-resources.tar.gz
          cp dist/fission_cli-x86_64-unknown-linux-gnu "${root}/bin/fission_cli"
          # upload/download-artifact does not keep the executable bit.
          chmod +x "${root}/bin/fission_cli"
          (cd "$(mktemp -d)" && env -u FISSION_ROOT "${root}/bin/fission_cli" \
            decomp "${GITHUB_WORKSPACE}/crates/fission-sleigh/testdata/a64_csel_select.so" --all \
            | grep -q "Function:")

      - name: Homebrew formula
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-v0.0.0-dryrun}"
          python3 scripts/release/render_homebrew_formula.py "${tag}" dist > dist/fission-cli.rb
          (cd dist && sha256sum fission-cli.rb > fission-cli.rb.sha256)
          ruby -c dist/fission-cli.rb
          ls -l dist

      - name: Record candidate digests
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            fission-x86_64-unknown-linux-gnu.tar.gz
            fission-aarch64-unknown-linux-gnu.tar.gz
            fission-aarch64-apple-darwin.tar.gz
            fission-x86_64-apple-darwin.tar.gz
            fission-x86_64-pc-windows-msvc.zip
            fission-resources.tar.gz
            fission-cli.rb
            fission_cli-x86_64-unknown-linux-gnu
          )
          cd dist
          for asset in "${targets[@]}"; do
            test -s "$asset"
            test -s "$asset.sha256"
          done
          sha256sum -c ./*.sha256
          sha256sum "${targets[@]}" ./*.sha256 > SHA256SUMS
          jq -n --arg sha "$SOURCE_SHA" --arg tag "$RELEASE_TAG"             '{sha: $sha, tag: $tag}' > release.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
