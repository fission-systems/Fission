name: Reusable Security Check

on:
  workflow_call:
    inputs:
      advisories:
        description: >-
          Also check the RustSec advisory database. Its answer changes when an
          advisory is published, not when the code does, so pull requests check
          it only when they change the dependency set; the nightly Heavy run
          checks it every day.
        type: boolean
        required: false
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          submodules: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Cargo.lock is consistent (--locked sanity)
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # Deterministic for a given Cargo.lock and deny.toml.
      - name: "Cargo Deny: bans, licenses, sources"
        run: cargo deny check bans licenses sources

      - name: "Cargo Deny: advisories"
        if: inputs.advisories
        run: cargo deny check advisories

      - name: Install cargo-audit
        if: inputs.advisories
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: "Cargo Audit: Check for Known Security Vulnerabilities"
        if: inputs.advisories
        run: |
          # --deny warnings: treat advisory warnings as errors
          # cranelift-jit 0.133.1 pins memmap2 0.2.x but only calls map_anon;
          # RUSTSEC-2026-0186 affects advise_range/flush_range APIs that are not
          # referenced by Cranelift. Remove this exception when Cranelift moves
          # to memmap2 >= 0.9.11.
          cargo audit --deny warnings --ignore RUSTSEC-2026-0186
