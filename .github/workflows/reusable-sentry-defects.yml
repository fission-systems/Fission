name: Reusable Sentry defect reporter

# Turns the defect evidence a run uploaded (nextest JUnit, the native
# differential log, the fixture replay witness, libFuzzer crash files) into
# Sentry events under the shared defect contract; see
# docs/CI_RELEASE_GATES.md, "CI defect events". Report-only: the job never
# changes a run's result, and nothing gates on it.
#
# A separate job rather than a step in each test job: SENTRY_DSN reaches only
# this job, which runs no build or test code, and one reporter per run is
# what makes the per-run cap (50 events, one per fingerprint) a run cap.
# Callers run it only for trusted events; the script refuses the rest again
# (pull requests, forks, runs not on main) and then only writes the summary.

on:
  workflow_call:
    inputs:
      pattern:
        description: "Artifact name glob of this run's evidence"
        required: true
        type: string
    secrets:
      SENTRY_DSN:
        required: false

permissions:
  contents: read

jobs:
  report:
    name: Sentry defect events
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Belt and braces: the script exits 0 once its arguments parse.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
            crates
          sparse-checkout-cone-mode: true
      # No match is a normal run: nothing failed.
      - name: Download evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ${{ inputs.pattern }}
          path: ${{ runner.temp }}/defect-evidence
      - name: Report defects
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          EVIDENCE: ${{ runner.temp }}/defect-evidence
        run: python3 scripts/ci/sentry_defects.py --scan "$EVIDENCE"
