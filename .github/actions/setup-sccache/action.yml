name: Setup sccache
description: >
  Install mozilla sccache with the GitHub Actions cache backend, prove the
  cache works by starting its server and compiling through it, and only then
  export RUSTC_WRAPPER. Any failure builds without the cache (ADR 0016: caches
  fail open). Pair with Swatinem/rust-cache for registry/git cache.

inputs:
  version:
    # mozilla-actions/sccache-action expects a GitHub release tag (with v prefix).
    # "0.10.0" downloads .../0.10.0/... which 404s; use "v0.10.0".
    description: sccache GitHub release tag (e.g. v0.10.0)
    required: false
    default: "v0.10.0"
  simulate-outage:
    description: >
      "true" points the cache service at an unresolvable host before the probe,
      to prove the job builds without the cache. Only the fallback self-test
      in ci.yml sets it.
    required: false
    default: "false"

outputs:
  enabled:
    description: '"true" when RUSTC_WRAPPER=sccache was exported, "false" when the job builds uncached'
    value: ${{ steps.probe.outputs.enabled }}

runs:
  using: composite
  steps:
    # A cache is an optimisation. When the cache service is down the build
    # runs uncached instead of failing: 19 jobs in 30 days failed here.
    - name: Install sccache (GHA cache backend)
      id: install
      continue-on-error: true
      uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      with:
        version: ${{ inputs.version }}

    # The server checks its storage when it starts, and a failed check kills
    # the compile that started it. probe.sh starts the server the build will
    # use, with the build's environment, and compiles through it; the wrapper
    # is exported only if that works. See probe.sh for the failure it fixes.
    - name: Probe sccache storage
      id: probe
      shell: bash
      env:
        INSTALL_OUTCOME: ${{ steps.install.outcome }}
        SIMULATE_OUTAGE: ${{ inputs.simulate-outage }}
      run: bash "$GITHUB_ACTION_PATH/probe.sh"
