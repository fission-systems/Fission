name: Setup sccache
description: >
  Install mozilla sccache with GitHub Actions backend and export RUSTC_WRAPPER.
  Pair with Swatinem/rust-cache for registry/git cache; sccache speeds recompiles.

inputs:
  version:
    # mozilla-actions/sccache-action expects a GitHub release tag (with v prefix).
    # "0.10.0" downloads .../0.10.0/... which 404s; use "v0.10.0".
    description: sccache GitHub release tag (e.g. v0.10.0)
    required: false
    default: "v0.10.0"

runs:
  using: composite
  steps:
    # A cache is an optimisation. When the cache service is down the build
    # runs uncached instead of failing: 19 jobs in 30 days failed here.
    - name: Install sccache (GHA cache backend)
      id: install
      continue-on-error: true
      uses: mozilla-actions/sccache-action@v0.0.9
      with:
        version: ${{ inputs.version }}

    - name: Export Rust wrapper env
      if: steps.install.outcome == 'success'
      shell: bash
      run: |
        echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        # Avoid noisy stats failures if sccache dies mid-job
        echo "SCCACHE_ERROR_LOG=${{ runner.temp }}/sccache.log" >> "$GITHUB_ENV"
        if sccache --version && sccache --show-stats; then
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        else
          echo "::warning::sccache is installed but not answering; building without it"
        fi
