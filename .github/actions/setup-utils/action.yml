name: Setup Utils
description: "Verify the versioned utils/ tree is present and complete"

# `utils/` is committed, so a checkout already has it and there is nothing to
# fetch. This used to download an `assets-v*` bundle over the checkout, which
# meant CI ran against a tree no one could inspect from the repository -- and
# assets-v3 turned out to hold 1,048 of 3,468 files, missing signatures/die
# entirely, while reporting 3,468 in its inventory.
#
# The step is kept rather than deleted so every workflow that calls it keeps a
# place to fail loudly when the tree is not there, which is what a shallow or
# partial checkout looks like.

inputs:
  assets_tag:
    description: "Unused; kept so callers that still pass it do not break"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Verify utils/ tree
      shell: bash
      run: |
        set -euo pipefail
        test -d utils || {
          echo "ERROR: utils/ is missing. It is committed to the repository —"
          echo "a checkout should have it. Check for a sparse or filtered clone."
          exit 1
        }

        # Each of these is loaded by a different part of the pipeline, so one
        # missing means a specific capability is silently degraded rather than
        # the tree being wholly absent.
        slaspec_count=$(find utils/sleigh-specs -name '*.slaspec' 2>/dev/null | wc -l | tr -d ' ')
        fpk_count=$(find utils -name '*.fpk' 2>/dev/null | wc -l | tr -d ' ')
        die_count=$(find utils/signatures/die -name '*.sg' 2>/dev/null | wc -l | tr -d ' ')

        echo "utils/: ${slaspec_count} slaspec, ${fpk_count} fpk, ${die_count} die signatures"

        test "${slaspec_count}" -gt 100 || {
          echo "ERROR: expected >100 .slaspec, found ${slaspec_count}"; exit 1; }
        test "${fpk_count}" -gt 200 || {
          echo "ERROR: expected >200 .fpk (FID, signatures, ordinals, Go), found ${fpk_count}"; exit 1; }
        test "${die_count}" -gt 1000 || {
          echo "ERROR: expected >1000 DIE .sg signatures, found ${die_count}"; exit 1; }
