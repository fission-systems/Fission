name: Benchmark regression

description: Report a DecBench regression (local sample-set gate or full-dataset sweep).
title: "benchmark: "
labels:
  - benchmark
  - regression
body:
  - type: markdown
    attributes:
      value: |
        Use this form when a benchmark metric, row, artifact, or comparison outcome regressed.

        > [!IMPORTANT]
        > Please attach or link the artifact directory and include the exact command used to generate it.

  - type: dropdown
    id: suite
    attributes:
      label: Benchmark suite
      options:
        - DecBench local sample-set gate
        - DecBench full sweep (unoptimized)
        - DecBench full sweep (other config)
        - other
    validations:
      required: true

  - type: input
    id: artifact
    attributes:
      label: Artifact path or URL
      placeholder: /tmp/gate_after.json (--dump output) or the sweep checkpoint directory
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Reproduction command
      render: bash
      placeholder: |
        cargo build -p fission-cli --release
        python scripts/quality/decbench_sample_set_gate.py check \
          --cli target/release/fission_cli --dump /tmp/gate_after.json
    validations:
      required: true

  - type: textarea
    id: deltas
    attributes:
      label: Metric deltas / failing rows
      render: text
      placeholder: |
        total GED: 1234 -> 1310
        perfect matches: 88 -> 81
        worst row: <binary>::<function>
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Triage notes
      description: Include low-score repro commands, debug bundle paths, suspected owner, or related PR/commit.
      placeholder: |
        Suspected owner: fission-pcode structuring
        debug_decomp_bundle: ...
        Related PR: #...
    validations:
      required: false
