name: Benchmark regression

description: Report a FreshBench regression (a sliced pre-check or the full M1 sweep).
title: "benchmark: "
labels:
  - benchmark
  - regression
body:
  - type: markdown
    attributes:
      value: |
        Use this form when a benchmark metric, row, artifact, or comparison outcome regressed.

        > [!IMPORTANT]
        > Please attach or link the artifact directory and include the exact command used to generate it.

  - type: dropdown
    id: suite
    attributes:
      label: Benchmark suite
      options:
        - FreshBench M1 slice (--builds / --only)
        - FreshBench M1 full sweep
        - other
    validations:
      required: true

  - type: input
    id: artifact
    attributes:
      label: Artifact path or URL
      placeholder: runs/<label>/ (the freshbench sweep run directory)
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Reproduction command
      render: bash
      placeholder: |
        cargo build -p fission-cli --release
        freshbench sweep run ~/freshbench-data/m1 --cli target/release/fission_cli --repo "$PWD" --label after
        freshbench sweep diff runs/before runs/after
    validations:
      required: true

  - type: textarea
    id: deltas
    attributes:
      label: Metric deltas / failing rows
      render: text
      placeholder: |
        GED mean distance: 4.12 -> 4.31
        perfect (rows at 0): 88 -> 81
        worst row: <build>/<project>/<binary> @ 0x...
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Triage notes
      description: Include low-score repro commands, debug bundle paths, suspected owner, or related PR/commit.
      placeholder: |
        Suspected owner: fission-pcode structuring
        debug_decomp_bundle: ...
        Related PR: #...
    validations:
      required: false
