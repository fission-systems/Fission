<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="fission-mark-title">
  <title id="fission-mark-title">Fission</title>

  <defs>
    <!-- Runs along the mark's own axis: bottom-left spine to top-right pad.
         Weighted so blue holds the lower spine before the violet turn, which
         is what makes the mark read as one trace rather than a colour wash. -->
    <linearGradient id="fissionTrace" x1="140" y1="452" x2="400" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#159CFF"/>
      <stop offset="0.22" stop-color="#3E85FB"/>
      <stop offset="0.42" stop-color="#7059F6"/>
      <stop offset="0.62" stop-color="#C13FD6"/>
      <stop offset="0.84" stop-color="#FF7A2F"/>
      <stop offset="1"    stop-color="#FFA81C"/>
    </linearGradient>

    <linearGradient id="fissionTile" x1="256" y1="36" x2="256" y2="476" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2F3F6"/>
    </linearGradient>

    <filter id="fissionTileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B1220" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Squircle tile -->
  <rect x="36" y="36" width="440" height="440" rx="104" ry="104"
        fill="url(#fissionTile)" filter="url(#fissionTileShadow)"/>

  <!-- Traces: one spine, three 45-degree spurs, each ending in a pad.
       Reads as an F, as a branching control-flow graph, and as circuit routing. -->
  <g fill="none" stroke="url(#fissionTrace)" stroke-width="32"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- spine, rising from a rounded foot, then turning out to the top pad -->
    <path d="M146 436 V186 L194 138 H346"/>
    <!-- middle spur -->
    <path d="M146 278 L194 230 H310"/>
    <!-- bottom spur -->
    <path d="M146 358 L194 310 H274"/>
  </g>

  <!-- Terminal pads -->
  <g stroke="none">
    <rect x="338" y="106" width="64" height="64" rx="17" ry="17" fill="#FFA81C"/>
    <rect x="302" y="198" width="64" height="64" rx="17" ry="17" fill="#C13FD6"/>
    <rect x="266" y="278" width="64" height="64" rx="17" ry="17" fill="#7B61FF"/>
  </g>
</svg>
